<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">

<title>13 Tonnen Prototyp</title>

<link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
 --titel:"Montserrat",ui-sans-serif,sans-serif;--fliess:"Open Sans",ui-sans-serif,sans-serif;--mono:"Inconsolata",ui-monospace,monospace;
 --text:#37352f;--muted:#787774;--faint:#a5a49f;--line:#e9e9e7;--edge:#b9b8b3;--ink:#3d3b37;--ink-h:#2f2e2b;--hover:#f1f1ef;--soft:#f7f6f3;
 --g1:#3d3b37;--g2:#6e6c67;--g3:#9e9c96;--g4:#c8c6c0;--g5:#e6e5e1;
 --hatch:repeating-linear-gradient(135deg,rgba(55,53,47,.22) 0 1.5px,transparent 1.5px 6px);
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:var(--fliess);line-height:1.5;font-size:15px}
h1,h2,h3{font-family:var(--titel);margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
h3{font-size:16px;font-weight:700}
p{margin:0 0 10px}
.num,.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 14px;max-width:900px}
.hint{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;font-size:14px;border:1px solid var(--edge);background:#fff;color:var(--text);padding:6px 12px;border-radius:0;cursor:pointer}
button:hover{background:var(--hover)}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
button.primary:hover{background:var(--ink-h)}
button:disabled{opacity:.4;cursor:default;background:#fff}
button.small{padding:2px 10px;font-size:13px}
input[type=radio],input[type=checkbox]{accent-color:var(--ink)}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
main{max-width:none;margin:0;padding:0}
.wrap{padding:24px 32px 90px;max-width:1360px;margin:0 auto}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top-in{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding:12px 32px 8px;max-width:1360px;margin:0 auto}
.who{display:flex;gap:12px;align-items:center}
.who .kick{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.who h1{font-size:24px}
.stats{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.st{border:1px solid var(--edge);padding:6px 14px;min-width:130px}
.st .v{font-family:var(--titel);font-weight:800;font-size:22px;line-height:1.15;white-space:nowrap}
.st.big{min-width:170px;border-color:var(--ink)}
.st.big .v{font-size:28px}
.st .s{font-size:12px;color:var(--muted)}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:12px;height:12px;border:1px solid var(--ink);display:block}
.pips i.f{background:var(--ink)}
.barbox{padding:0 32px 12px;max-width:1360px;margin:0 auto}
.bar{position:relative;height:16px;display:flex;background:#fff;border:1px solid var(--edge)}
.seg{position:relative;height:100%;border-right:1px solid #fff}
.seg::after{content:"";position:absolute;inset:0;background:var(--hatch)}
.mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:2px 18px;margin-top:6px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.legend i{position:relative;display:inline-block;width:12px;height:12px}
.legend i::after{content:"";position:absolute;inset:0;background:var(--hatch)}
.legend b{color:var(--text);font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.tab{display:flex;align-items:center;gap:10px;border:1px solid var(--edge);padding:5px 12px 5px 5px;font-size:14px;background:#fff}
.tab .n{font-family:var(--mono);font-size:12px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--hover);color:var(--muted)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on .n{background:#fff;color:var(--ink)}
.callout{display:flex;gap:10px;background:var(--soft);padding:10px 14px;margin:8px 0;font-size:14px}
.callout .ic{width:20px;flex:0 0 20px;height:20px;background:#e3e2de;color:#5f5e5b;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
.panel{position:sticky;top:150px;max-height:calc(100vh - 160px);overflow:auto;border:1px solid var(--edge);padding:16px 18px;background:#fff}
.panel hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;border:1px solid var(--edge);padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:6px;min-height:170px}
.card:hover{border-color:var(--ink)}
.card.on{box-shadow:0 0 0 2px var(--ink);border-color:var(--ink)}
.card.off{color:var(--faint)}
.card.off .ti,.card.off .pts{color:var(--faint)}
.card .stripe{position:absolute;left:-1px;top:-1px;bottom:-1px;width:5px}
.card .stripe::after{content:"";position:absolute;inset:0;background:var(--hatch)}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .pts{font-family:var(--titel);font-weight:800;font-size:16px;white-space:nowrap}
.card .ti{font-family:var(--titel);font-weight:700;font-size:15px;line-height:1.25}
.card .tx{font-size:14px}
.card .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.cost{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.why{font-size:12.5px;color:var(--muted);font-style:italic}
details{font-size:13px;color:var(--text)}
details p{margin:6px 0 0}
summary{cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.vote{border-top:1px solid var(--line);padding:12px 0}
.vote:first-of-type{border-top:0}
.chance{font-family:var(--titel);font-weight:800;font-size:22px}
.cbar{height:9px;background:var(--g5);margin:4px 0 8px;position:relative}
.cbar i{display:block;height:100%;background:var(--g2);position:relative}
.cbar i::after{content:"";position:absolute;inset:0;background:var(--hatch)}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res{font-family:var(--titel);font-weight:800}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:10px 0 18px}
.ibox{border:1px solid var(--edge);padding:12px 14px}
.ibox .v{font-family:var(--titel);font-weight:800;font-size:28px;line-height:1.15}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fig{border:1px solid var(--edge);padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;background:#fff}
.fig:hover{border-color:var(--ink)}
.fig.on{box-shadow:0 0 0 2px var(--ink);border-color:var(--ink)}
.fig .im{flex:0 0 auto;background:var(--soft);padding:6px}
section{margin-bottom:32px}
.sec{margin:26px 0 10px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.sum td{font-weight:700;border-top:1px solid var(--ink)}
.foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--edge);padding:10px 0;display:flex;gap:12px;align-items:center;margin-top:14px}
.code{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:.2em}
input.codein{font:700 18px var(--mono);width:7em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--edge);border-radius:0;background:var(--soft)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.panel{position:static;max-height:none}.top-in{grid-template-columns:1fr}.stats{justify-content:flex-start}.cards{grid-template-columns:1fr}}
/* ---- Pixel-Rahmen ---- */
:root{--p:3px;--fc:var(--ink);--sh:rgba(55,53,47,.18);
 --dither:repeating-conic-gradient(rgba(55,53,47,.35) 0 25%,transparent 0 50%) 0 0/4px 4px}
.st,.ibox,.card,.panel,.fig,.tab,button,.callout,.bar,input.codein,.foot-btn{
 border:0!important;
 box-shadow:0 calc(-1*var(--p)) 0 0 var(--fc),0 var(--p) 0 0 var(--fc),calc(-1*var(--p)) 0 0 0 var(--fc),var(--p) 0 0 0 var(--fc),
  calc(2*var(--p)) calc(2*var(--p)) 0 0 var(--sh);
 margin:var(--p);
}
.st,.ibox,.panel,.fig,.card{--fc:var(--edge)}
.st.big,.ibox.hi{--fc:var(--ink)}
.callout{--fc:var(--g4);--sh:transparent}
.bar{--sh:transparent;--fc:var(--ink);height:18px}
.card:hover,.fig:hover{--fc:var(--ink);transform:translate(-1px,-1px)}
.card.on,.fig.on{--fc:var(--ink);box-shadow:0 calc(-1*var(--p)) 0 0 var(--ink),0 var(--p) 0 0 var(--ink),calc(-1*var(--p)) 0 0 0 var(--ink),var(--p) 0 0 0 var(--ink),inset 0 0 0 var(--p) var(--ink),calc(2*var(--p)) calc(2*var(--p)) 0 0 var(--sh)}
.cards,.figs,.boxes{gap:18px}
.stats{gap:14px}
.tabs{gap:12px}
/* Knöpfe mit Pixelkante */
button{--fc:var(--ink);padding:6px 14px;
 box-shadow:0 calc(-1*var(--p)) 0 0 var(--fc),0 var(--p) 0 0 var(--fc),calc(-1*var(--p)) 0 0 0 var(--fc),var(--p) 0 0 0 var(--fc),
  inset calc(-1*var(--p)) calc(-1*var(--p)) 0 0 rgba(55,53,47,.18),calc(2*var(--p)) calc(2*var(--p)) 0 0 var(--sh)}
button.primary{box-shadow:0 calc(-1*var(--p)) 0 0 var(--fc),0 var(--p) 0 0 var(--fc),calc(-1*var(--p)) 0 0 0 var(--fc),var(--p) 0 0 0 var(--fc),
  inset calc(-1*var(--p)) calc(-1*var(--p)) 0 0 rgba(0,0,0,.45),inset var(--p) var(--p) 0 0 rgba(255,255,255,.18),calc(2*var(--p)) calc(2*var(--p)) 0 0 var(--sh)}
button:active:not(:disabled){transform:translate(var(--p),var(--p));
 box-shadow:0 calc(-1*var(--p)) 0 0 var(--fc),0 var(--p) 0 0 var(--fc),calc(-1*var(--p)) 0 0 0 var(--fc),var(--p) 0 0 0 var(--fc)}
button:disabled{--fc:var(--g4);--sh:transparent}
button.small{padding:1px 10px}
.tab{--sh:transparent;--fc:var(--edge)}
.tab.on{--fc:var(--ink)}
.tab .n{box-shadow:none}
input.codein{--fc:var(--edge);--sh:transparent}
/* Pixelmuster statt Schraffur */
.seg::after,.legend i::after,.card .stripe::after,.cbar i::after{background:var(--dither)}
.card .stripe{left:0;top:0;bottom:0;width:6px}
.cbar{height:12px;background:var(--g5);box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);margin:6px 2px 10px}
.cbar i{background:var(--g2)}
.pips i{width:12px;height:12px;border:0;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);margin:2px}
.pips i.f{background:var(--ink)}
.pips{gap:6px}
.mark{width:3px;background:var(--ink)}
/* Kästchen und Häkchen */
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:14px;height:14px;margin:0 4px 0 2px;vertical-align:-2px;background:#fff;
 box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);cursor:pointer}
input[type=checkbox]:checked{background:var(--ink);box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 0 0 0 3px #fff}
input[type=checkbox]:disabled{opacity:.4;cursor:default}
/* Trennlinien gepunktet wie Pixel */
.top{border-bottom:0;background-image:linear-gradient(90deg,var(--ink) 50%,transparent 50%);background-size:6px 3px;background-repeat:repeat-x;background-position:bottom;background-color:#fff}
.panel hr,.vote{border-top:0}
.panel hr{height:3px;background:linear-gradient(90deg,var(--g4) 50%,transparent 50%) 0 0/6px 3px repeat-x}
.vote+.vote{background:linear-gradient(90deg,var(--g4) 50%,transparent 50%) 0 0/6px 3px repeat-x;padding-top:15px}
td,th{border-bottom:0;background:linear-gradient(90deg,var(--g5) 50%,transparent 50%) 0 100%/6px 2px repeat-x}
tr.sum td{border-top:0;background:linear-gradient(90deg,var(--ink) 50%,transparent 50%) 0 0/6px 3px repeat-x}
.fig .im{box-shadow:0 -2px 0 0 var(--g4),0 2px 0 0 var(--g4),-2px 0 0 0 var(--g4),2px 0 0 0 var(--g4);margin:2px}
.callout .ic{box-shadow:none}
.panel{top:156px}
/* ---- Erweiterungen ---- */
.chart{width:100%;max-width:760px;height:auto;display:block}
.chart .ct{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.drow{display:flex;align-items:center;gap:12px;margin:8px 0}
.dbar{flex:1;height:14px;background:var(--g5);position:relative;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.dbar i{display:block;height:100%;background:var(--g2);position:relative}
.dbar i::after{content:"";position:absolute;inset:0;background:var(--dither)}
.stufen{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}
.stufe{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;margin:3px;color:var(--faint);
 box-shadow:0 -3px 0 0 var(--g4),0 3px 0 0 var(--g4),-3px 0 0 0 var(--g4),3px 0 0 0 var(--g4)}
.stufe .n{font-family:var(--mono);width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--hover)}
.stufe.ok{color:var(--text);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),6px 6px 0 0 var(--sh)}
.stufe.ok .n{background:var(--ink);color:#fff}
.ta{width:100%;font:inherit;font-size:14px;border:0;background:var(--soft);padding:8px;resize:vertical;box-shadow:inset 0 0 0 2px var(--g4)}
.ta:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.vlist{margin:4px 0;padding-left:20px}.vlist li{margin:4px 0}
details.rules{margin:6px 0 4px}
details.rules>summary{font-size:13px}
/* Geführte Runde */
.coach{position:fixed;left:24px;bottom:24px;z-index:50;background:#fff;max-width:380px;padding:14px 16px;margin:3px;
 box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),9px 9px 0 0 rgba(55,53,47,.3)}
.coachme{outline:3px dashed var(--ink);outline-offset:8px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{outline-color:transparent}}
/* Spielgefühl */
.fdelta{position:absolute;right:10px;top:8px;font-family:var(--titel);font-weight:800;font-size:16px;opacity:0;pointer-events:none}
.fdelta.go{animation:floatup .9s steps(6) forwards}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.seg{transition:width .45s steps(5)}
.cbar{position:relative}
.roll{position:absolute;top:-6px;bottom:-6px;width:4px;background:var(--ink);margin-left:-2px}
.roll.anim{animation:rollin 1.1s steps(11) both}
@keyframes rollin{0%{left:0}}
.res.late{animation:appear .1s 1.15s both}
@keyframes appear{from{opacity:0}to{opacity:1}}
.card.on{animation:pick .25s steps(3)}
@keyframes pick{0%{transform:translate(3px,3px)}100%{transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Handy */
@media(max-width:700px){
 .top-in{padding:8px 14px 4px;gap:8px}
 .barbox{padding:0 14px 8px}
 .who h1{font-size:18px}.who .px{width:24px;height:31px}
 .stats{gap:8px;flex-wrap:nowrap;overflow-x:auto}
 .st{min-width:auto;padding:4px 8px}.st .s,.st .pips{display:none}.st .lbl{font-size:10px;white-space:nowrap}.stats .st:nth-child(2),.stats .st:nth-child(3){display:none}.st .v{font-size:16px}.st.big .v{font-size:20px}.st.big{min-width:auto}
 .legend{font-size:10px;gap:2px 10px}
 .wrap{padding:16px 14px 80px}
 .panel{top:auto}
 .coach{left:8px;right:8px;bottom:8px;max-width:none}
 .tabs .tab{font-size:12px}
}
</style>
</head>

/* ---------- Modell ---------- */
function vorlFrom(r){return r<LAST?PER[r+1].a:Math.ceil((PER[LAST].a+PER[LAST].b)/2)}
function ownActive(id,y){return S.chosen[id]!==undefined&&S.chosen[id]<=y}
function adds(y,own){
 const a={};
 if(!own)return a;
 if(ownActive("I2",y))a.oev=(a.oev||0)+0.1;
 for(const e of S.events){
  if(e.from>y)continue;
  if(e.id=="E1")a.auto=(a.auto||0)+0.1;
  if(e.id=="E4"&&!(ownActive("C4",y)))a.sonst=(a.sonst||0)+0.1;
 }
 return a;
}
function subs(y,opt){
 // opt: {own:true/false, vorl:true/false, without:id, extra:{own:id}|{vorl:id,from}}
 const v={};
 for(const k in M.BASE)v[k]=M.BASE[k];
 if(opt.own){
  for(const id in S.chosen){if(id===opt.without)continue;if(!ownActive(id,y))continue;
   const m=M.CARDS[id].mult;for(const k in m)v[k]*=m[k];}
  if(opt.extraOwn){const m=M.CARDS[opt.extraOwn].mult;for(const k in m)v[k]*=m[k];}
 }
 if(opt.vorl){
  for(const id in S.adopted){if(id===opt.without)continue;if(S.adopted[id]>y)continue;
   const m=M.VORL[id].mult;for(const k in m)v[k]*=m[k];}
  if(opt.extraVorl){const m=M.VORL[opt.extraVorl].mult;for(const k in m)v[k]*=m[k];}
  if(S.adopted.K12!==undefined&&S.adopted.K12<=y&&opt.without!=="K12")v.oeff-=0.002;
 }
 const a=adds(y,opt.own);
 if(opt.own&&opt.extraOwn==="I2")a.oev=(a.oev||0)+0.1;
 for(const k in a)v[k]+=a[k];
 const f=Math.pow(1-TREND,y-2026);
 for(const k in v)v[k]*=f;
 return v;
}
const tot=v=>Object.values(v).reduce((s,x)=>s+x,0);
const val=(y,opt)=>tot(subs(y,opt));
const ACT={own:true,vorl:true}, VO={own:false,vorl:true}, NO={own:false,vorl:false};
function sum(a,b,opt){let s=0;for(let y=a;y<=b;y++)s+=val(y,opt);return s}

function fig(){return M.FIG[S.fig]}
function costH(id){
 let h=M.CARDS[id].h;const mod=fig().mod[id]||0;
 if(mod){h=h>0?Math.max(1,h+mod):h+mod;}
 for(const k in S.adopted){const s=M.SYN[k];if(s&&s.h&&s.h.includes(id))h=Math.max(0,h-1);}
 if(id=="N2"&&S.flags.e3==S.r)h=Math.max(0,h-1);
 return h;
}
function costG(id){
 let g=M.CARDS[id].g;if(g<=0)return g;
 for(const k in S.adopted){const s=M.SYN[k];if(s&&s.g&&s.g.includes(id))g-=1;}
 if(id=="W2"&&S.flags.e2==S.r)g-=1;
 return Math.max(0,g);
}
function blocked(id){
 const f=fig(),c=M.CARDS[id];
 if(f.ban.includes(id))return REASON[id]||"Passt nicht zu deiner Lebenslage.";
 if(chalBan(id))return "Gesperrt durch die Herausforderung.";
 if(S.chosen[id]!==undefined)return null;
 if(id=="W2"&&S.flags.w2locked)return "Gesperrt: Es wurde wieder eine Ölheizung eingebaut (Lock-in bis 2050).";
 if(id=="W2b"&&S.flags.w2locked)return "Gesperrt: Es wurde wieder eine Ölheizung eingebaut (Lock-in bis 2050).";
 for(const x of (c.excl||[]))if(S.chosen[x]!==undefined)return "Geht nicht zusammen mit «"+T[x].title+"».";
 if((id=="I1a"||id=="I5")&&S.chosen.I1b!==undefined)return "Schon abgedeckt: Du fliegst gar nicht mehr.";
 if(id=="N1"&&(S.chosen.N2!==undefined||S.chosen.N3!==undefined))return "Schon abgedeckt durch vegetarisch oder vegan.";
 if(id=="N2"&&S.chosen.N3!==undefined)return "Schon abgedeckt: Du isst vegan.";
 if(costH(id)>freeH())return "Zu wenig Herzen in dieser Runde.";
 if(costG(id)>S.money)return "Zu wenig Geld.";
 return null;
}
function effOwn(id){const y=PER[S.r].a;
 if(S.chosen[id]!==undefined)return val(y,{...ACT,without:id})-val(y,ACT);
 return val(y,ACT)-val(y,{...ACT,extraOwn:id});}
function choose(id){
 if(S.results||S.waiting)return;
 if(S.chosen[id]!==undefined){ // zurücknehmen, nur diese Runde
  if(!S.thisRound.includes(id))return;
  S.hearts+=costH(id);const g=costG(id);S.money+= g>0?g:0; if(g<0)S.money-=2;
  delete S.chosen[id];S.thisRound=S.thisRound.filter(x=>x!==id);
 } else {
  if(blocked(id))return;
  S.hearts-=costH(id);const g=costG(id);if(g>0)S.money-=g;else if(g<0)S.money+=2;
  S.chosen[id]=PER[S.r].a;S.thisRound.push(id);
 }
 render();
}

/* ---------- Ablauf ---------- */
const HAND=6;
function income(f,r){if(S.chal=="knapp")return 0;const c=M.INC[f];return c[r%c.length];}
function incText(f){const c=M.INC[f];return c.length==1?c[0]+" pro Runde":"1 jede zweite Runde";}
const usedH=()=>Object.values(S.alloc).reduce((a,b)=>a+b,0);
const freeH=()=>S.hearts-usedH();
function avail(id){ // kommt grundsätzlich noch in Frage (ohne Kosten)
 const f=fig(),c=M.CARDS[id];
 if(f.ban.includes(id)||chalBan(id)||S.chosen[id]!==undefined)return false;
 if((id=="W2"||id=="W2b")&&S.flags.w2locked)return false;
 for(const x of (c.excl||[]))if(S.chosen[x]!==undefined)return false;
 if((id=="I1a"||id=="I5")&&S.chosen.I1b!==undefined)return false;
 if(id=="N1"&&(S.chosen.N2!==undefined||S.chosen.N3!==undefined))return false;
 if(id=="N2"&&S.chosen.N3!==undefined)return false;
 return true;
}
function drawHand(){
 const pool=Object.keys(M.CARDS).filter(avail),hand=[];
 const take=id=>{if(pool.includes(id)&&!hand.includes(id))hand.push(id)};
 if(S.flags.e2==S.r)take("W2"); if(S.flags.e3==S.r)take("N2");
 const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
 for(const a of "IWNC"){if(hand.length>=HAND)break;const c=shuf(pool.filter(k=>k[0]==a&&!hand.includes(k)));if(c.length)hand.push(c[0]);}
 for(const k of shuf(pool.filter(k=>!hand.includes(k)))){if(hand.length>=HAND)break;hand.push(k);}
 const ord="IWNC";hand.sort((x,y)=>ord.indexOf(x[0])-ord.indexOf(y[0]));
 S.hand=hand;
}
function startFig(f){S.fig=f;S.r=0;S.money=M.START[f];beginRound();}
function beginRound(){
 S.hearts=3;S.money+=income(S.fig,S.r);S.thisRound=[];drawHand();if(G)G.ballotFor(S.r);else drawBallot();S.results=null;S.event=null;S.waiting=false;
 let note=[];
 if(S.adopted.K6!==undefined&&S.adopted.K6<=PER[S.r].a){
  if(S.chosen.I1b!==undefined){S.money+=1;note.push("Flugticketabgabe: Du fliegst nicht mehr und bekommst 1 Geld zurück.");}
  else{const d=Math.min(1,S.money);S.money-=d;note.push("Flugticketabgabe: Du fliegst noch und zahlst 1 Geld.");}
 }
 if(S.freeNote){note.push(S.freeNote);S.freeNote=null;}
 S.roundNote=note;
 S.snap[S.r]={y:PER[S.r].a,act:val(PER[S.r].a,ACT)};
 announceEvent();S.revealed=null;
 if(S.r==0&&!lsGet("13t_tut"))S.coach=0;
 if(G)NET.update(G.path(),{now:+val(PER[S.r].a,ACT).toFixed(2)});
 S.screen="round";render();window.scrollTo(0,0);
}
function drawBallot(){
 const prev=S.ballot||[];let pool=Object.keys(M.VORL).filter(k=>S.adopted[k]===undefined&&!prev.includes(k));
 if(pool.length<2)pool=Object.keys(M.VORL).filter(k=>S.adopted[k]===undefined);
 S.ballot=[];while(S.ballot.length<2&&pool.length){S.ballot.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);}
 S.alloc={};S.don={};S.ballot.forEach(k=>{S.alloc[k]=0;S.don[k]=0});
}
const SPENDE=2,SPENDEP=15;
function chance(k){
 if(G){const g=G.totals(k);return Math.min(MAXC,Math.round(M.VORL[k].c*100+bonus(k)+g.h*30/G.n()+g.d*SPENDEP/G.n()));}
 return Math.min(MAXC,Math.round(M.VORL[k].c*100)+bonus(k)+S.alloc[k]*30+(S.don[k]?SPENDEP:0))}
function donate(k){if(S.results||S.waiting)return;if(S.don[k]){S.don[k]=0;S.money+=SPENDE;}else{if(S.money<SPENDE)return;S.don[k]=1;S.money-=SPENDE;}if(G)G.push();render();}
function alloc(k,d){if(S.results||S.waiting)return;
 if(d>0&&freeH()<=0)return;if(d<0&&S.alloc[k]==0)return;S.alloc[k]+=d;if(G)G.push();render();}
function freeRide(){}
function vote(){
 if(G){G.ready();return;}
 S.results=S.ballot.map(k=>{const c=chance(k),roll=Math.floor(Math.random()*100);const ok=roll<c;
  if(ok)S.adopted[k]=vorlFrom(S.r);else{S.rejects=S.rejects||{};S.rejects[k]=(S.rejects[k]||0)+1;}return {k,c,ok,roll}});
 freeRide();
 S.log.push({r:S.r,cards:[...S.thisRound],votes:S.results,hearts:Object.values(S.alloc).reduce((a,b)=>a+b,0),don:Object.values(S.don).reduce((a,b)=>a+b,0)*SPENDE});
 render();
}
function toEvent(){
 let e=S.nextEvent||"ruhig";
 if(e!=="ruhig"&&!eventCands().includes(e)){S.event="abgewendet";S.averted=e;}
 else{S.event=e;S.averted=null;
  const nextY=vorlFrom(S.r);
  if(e!=="ruhig"){S.happened.push(e);}
  if(e=="E1")S.events.push({id:"E1",from:nextY});
  if(e=="E2")S.flags.e2=S.r+1;
  if(e=="E3")S.flags.e3=S.r+1;
  if(e=="E4"){S.money=Math.max(0,S.money-2);S.events.push({id:"E4",from:nextY});}}
 S.log[S.log.length-1].event=S.event=="abgewendet"?"abgewendet":S.event;
 S.screen="event";render();window.scrollTo(0,0);
}
function nextRound(){
 if(S.flags.e2===S.r&&S.chosen.W2===undefined)S.flags.w2locked=true;
 if(S.r<LAST){S.r++;beginRound();}else{S.screen="end";render();window.scrollTo(0,0);}
}

/* ---------- Ansicht ---------- */
const AREAN={I:"Mobilität",W:"Wohnen",N:"Ernährung",C:"Konsum"};
const GSH=["var(--g1)","var(--g2)","var(--g3)","var(--g4)","var(--g5)"];
const AREASH={I:GSH[0],W:GSH[1],N:GSH[2],C:GSH[3]};
const CATSHORT={"Mobilität":"Mobilität","Wohnen":"Wohnen","Ernährung":"Ernährung","Konsum und Freizeit":"Konsum","Öffentliche Leistungen":"Öffentlich"};
function pips(n,max=3){let s="";for(let i=0;i<Math.max(max,n);i++)s+=`<i class="${i<n?"f":""}"></i>`;return `<div class="pips">${s}</div>`}
function barHTML(v){
 const c=bycat(v),W=13.5;
 const segs=CATS.map((x,i)=>`<div class="seg" title="${x}: ${fmt(c[x])} t" style="width:${c[x]/W*100}%;background:${GSH[i]}"></div>`).join("");
 return `<div class="bar">${segs}<div class="mark" style="left:${ZIEL/W*100}%" title="Ziel 0.6 t"></div></div>
 <div class="legend">${CATS.map((x,i)=>`<span class="k"><i style="background:${GSH[i]}"></i>${CATSHORT[x]} <b>${fmt(c[x])}</b></span>`).join("")}<span class="k">▏Ziel <b>0.6</b></span></div>`;
}
function header(){
 const p=PER[S.r],y=p.a,v=subs(y,ACT),a=tot(v),n=val(y,NO),so=S.r?sum(2026,y-1,ACT):0;
 return `<div class="top"><div class="top-in">
 <div class="who">${figImg(S.fig,2)}<div><div class="kick">13 Tonnen · Runde ${S.r+1} von ${PER.length}${G?" · Raum "+G.code:""}</div><h1>${S.fig}${G?` <span class="muted" style="font-size:16px;font-weight:600">${G.myColor()}</span>`:""}</h1></div></div>
 <div class="stats">
  <div class="st big" id="stats" style="position:relative"><div class="lbl">Fussabdruck ${y}</div><div class="v" id="footv" data-v="${a.toFixed(3)}">${fmt(a)} t</div><div class="s">pro Jahr</div><span id="fdelta" class="fdelta"></span></div>

  <div class="st"><div class="lbl">Herzen</div><div class="v">${freeH()}</div>${pips(freeH())}</div>
  <div class="st"><div class="lbl">Geld</div><div class="v">${S.money}</div><div class="s">nimmst du mit</div></div>
 </div></div><div class="barbox">${barHTML(v)}</div></div>`;
}
function tabs(on){return `<div class="tabs">${["Entscheide und Abstimmung","Ereignis","Bilanz"].map((s,i)=>`<div class="tab ${i==on?"on":""}"><span class="n">${i+1}</span>${s}</div>`).join("")}<div class="tab" style="padding-left:12px;border-style:dashed">${PER[S.r].l}</div></div>`}
const HZ=n=>`${n} ${n==1||n=="1"?"Herz":"Herzen"}`;
const GD=n=>`${n} Geld`;
function details(t){return `<details><summary>Woher die Zahl?</summary><p>${esc(t.back)}</p>${t.why?`<p>${esc(t.why)}</p>`:""}${t.game?`<p><i>Im Spiel:</i> ${esc(t.game)}</p>`:""}</details>`}
function cardHTML(id){
 const t=T[id],b=blocked(id),on=S.chosen[id]!==undefined,mine=S.thisRound.includes(id);
 const e=effOwn(id),h=costH(id),g=costG(id);
 const gtxt=g<0?"2 Geld zurück":GD(g);
 const btn=on?(mine?`<button class="small" onclick="choose('${id}')">Zurücknehmen</button>`:`<span class="lbl">seit ${S.chosen[id]}</span>`)
  :`<button class="small ${b?"":"primary"}" ${b?"disabled":""} onclick="choose('${id}')">Wählen</button>`;
 return `<div class="card ${on?"on":""} ${b&&!on?"off":""}">
 <div class="hd"><span class="lbl">${AREAN[id[0]]} · ${strat(id)}</span><span class="pts">${sgn(-e,Math.abs(e)<0.095?2:1)} t</span></div>
 <div class="ti">${esc(t.title)}</div><div class="tx">${esc(t.front)}</div>
 ${b&&!on?`<div class="why">${esc(b)}</div>`:""}
 ${details(t)}
 <div class="ft"><span class="cost">${HZ(h)} · ${gtxt}</span>${btn}</div></div>`;
}
function vEff(k){const y=vorlFrom(S.r);return val(y,ACT)-val(y,{...ACT,extraVorl:k});}
function ballotHTML(){
 let h=`<div class="lbl">Abstimmungssonntag</div><h3 style="margin:2px 0 6px">Zwei Vorlagen</h3>
 <p class="hint">${G?`Ihr seid ${G.n()}: Ein Herz bringt +${fmt(30/G.n(),0)} Prozentpunkte, eine Kampagne (2 Geld) +${fmt(SPENDEP/G.n(),0)}. Es zählt die ganze Gruppe.`:`Ein Herz bringt +30 Prozentpunkte, eine Kampagne (2 Geld) +15.`} Angenommen wirkt ab ${vorlFrom(S.r)}.</p>`;
 for(const k of S.ballot){const t=T[k],r=S.results&&S.results.find(x=>x.k==k),c=chance(k);
  h+=`<div class="vote"><div class="hd" style="display:flex;justify-content:space-between;gap:8px"><span class="lbl">${strat(k)} · ${sgn(-vEff(k),2)} t für dich</span></div>
  <div class="ti" style="font-family:var(--titel);font-weight:700">${esc(t.title)}</div><div class="tx" style="font-size:14px">${esc(t.front)}</div>
  <div class="row" style="justify-content:space-between;margin-top:6px"><span class="lbl">Chance</span><span class="chance">${c} %</span></div>
  <div class="cbar"><i style="width:${c}%"></i>${S.results?`<b class="roll ${S.revealed===S.r?"":"anim"}" style="left:${r.roll}%"></b>`:""}</div>
  ${bonus(k)?`<div class="hint">Kommt wieder, besser vorbereitet: +${bonus(k)} Prozentpunkte.</div>`:""}
  ${CONTRA[k]?`<div class="hint"><b>Dagegen spricht:</b> ${CONTRA[k]}</div>`:""}
  ${G?`<div class="hint">Gruppe: ${HZ(G.totals(k).h)} · ${G.totals(k).d} Kampagnen</div>`:""}
  ${S.results?`<div class="res ${S.revealed===S.r?"":"late"}" style="font-size:18px;margin-top:4px">${r.ok?"Angenommen":"Abgelehnt"} <span class="hint" style="font-weight:400">Wurf ${r.roll}</span></div>`:
  `<div class="ctl"><button class="small" onclick="alloc('${k}',-1)">−</button><span class="mono">${HZ(S.alloc[k])}</span><button class="small" onclick="alloc('${k}',1)">+</button>
   <label class="hint" style="margin-left:auto"><input type="checkbox" ${S.don[k]?"checked":""} ${!S.don[k]&&S.money<SPENDE?"disabled":""} onchange="donate('${k}')"> Kampagne, 2 Geld</label></div>`}
  ${details(t)}</div>`;}
 return h;
}
function viewRound(){
 let L="",P="";
 if(S.roundNote&&S.roundNote.length)L+=S.roundNote.map(x=>`<div class="callout"><span class="ic">!</span><span>${x}</span></div>`).join("");
 if(S.r>0){const p=S.snap[S.r-1],y=PER[S.r].a,d=val(y,ACT)-p.act;
  const dt=val(y,NO)-val(p.y,NO), dv=(val(y,VO)-val(y,NO))-(val(p.y,VO)-val(p.y,NO));
  L+=`<div class="callout"><span class="ic">Δ</span><span>Seit der letzten Runde <b class="mono">${sgn(d)} t</b> pro Jahr. Trend <span class="mono">${sgn(dt)}</span>, Vorlagen <span class="mono">${sgn(dv)}</span>, deine Entscheide und Ereignisse <span class="mono">${sgn(d-dt-dv)}</span>.</span></div>`;}
 L+=`<div class="sec"><h2>Deine Auswahl</h2><p class="sub">${S.hand.length} Karten aus allen Bereichen. Jede gilt ab jetzt jedes Jahr bis 2050. Was du nicht nimmst, kann später wieder auftauchen.</p></div>
 ${CHAL[S.chal||"keine"].ban==="alle"?`<div class="callout"><span class="ic">!</span><span>Herausforderung «Nur Politik»: Du wählst keine eigenen Karten. Setze alle Herzen fürs Engagement ein.</span></div>`:`<div class="cards" id="cards">${S.hand.map(cardHTML).join("")}</div>`}`;
 const old=Object.keys(S.chosen).filter(k=>!S.thisRound.includes(k));
 if(old.length)L+=`<div class="sec"><h2>Deine Vorsätze bisher</h2></div><table><tr><th>Vorsatz</th><th>seit</th><th class="n">Wirkung pro Jahr</th></tr>${old.map(k=>`<tr><td>${esc(T[k].title)}</td><td class="mono">${S.chosen[k]}</td><td class="n">${sgn(-effOwn(k))} t</td></tr>`).join("")}</table>`;
 P=(G?groupPanel():"")+ballotHTML();
 const ne=S.nextEvent;P+=`<hr><div class="lbl">Droht nach dieser Runde</div><p style="margin:4px 0 0">${ne=="ruhig"?"Nichts Besonderes in Sicht.":`<b>${esc(T[ne].title)}</b>. ${esc(T[ne].front||"")}`}</p>${ne!="ruhig"&&AVERT[ne]?`<p class="hint">Wer vorsorgt, kann es abwenden.</p>`:""}`;
 const stc=G&&ROOM&&ROOM.stage&&ROOM.stage[S.r]&&ROOM.stage[S.r].contrib;
 P+=`<hr>`+(S.results?`${stc?`<div class="lbl">Engagement der Gruppe</div><table style="margin:4px 0 10px">${Object.values(stc).map(c=>`<tr><td>${c.fig} (${c.color})</td><td class="n">${HZ(c.h)}${c.d?", "+c.d+" Kampagnen":""}</td></tr>`).join("")}</table>`:""}<p>${S.results.filter(x=>x.ok).length} von ${S.results.length} Vorlagen angenommen. Deine Entscheide stehen fest.</p><button class="primary" style="width:100%" onclick="toEvent()">Weiter zum Ereignis</button>`
 :S.waiting?`<p>Du bist fertig. Warten auf: ${G.missing().join(", ")||"…"}</p><button style="width:100%" onclick="G.unready()">Doch noch ändern</button>`
 :`<p class="hint">Übrig: ${HZ(freeH())} und ${GD(S.money)}. Herzen verfallen am Ende der Runde.</p><button id="finish" class="primary" style="width:100%" onclick="vote()">${G?"Fertig, abstimmen":"Abstimmen und Runde abschliessen"}</button>`);
 return header()+`<div class="wrap">${tabs(0)}<div class="layout"><div>${L}</div><aside class="panel" id="panel">${P}</aside></div></div>`;
}

/* Verlaufskurve als Pixelgrafik */
function chartSVG(toYear,opts){
 const W=640,H=200,L=34,R=22,T=10,B=24,y0=2026,y1=2050,vmax=13.5;
 const X=y=>L+(y-y0)/(y1-y0)*(W-L-R), Y=v=>T+(1-v/vmax)*(H-T-B);
 const path=(f,to)=>{let d="";for(let y=y0;y<=to;y++){const v=f(y);const x=X(y),x2=X(Math.min(y+1,y1));d+=(y==y0?"M":"L")+x.toFixed(1)+" "+Y(v).toFixed(1)+"L"+x2.toFixed(1)+" "+Y(v).toFixed(1);}return d};
 let g="";
 for(const v of [0,4,8,12]){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--g5)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" class="ct">${v}</text>`;}
 for(const y of [2026,2030,2035,2040,2045,2050])g+=`<text x="${X(y)}" y="${H-6}" text-anchor="middle" class="ct">${y}</text>`;
 g+=`<line x1="${L}" x2="${W-R}" y1="${Y(ZIEL)}" y2="${Y(ZIEL)}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 4"/><text x="${W-R}" y="${Y(ZIEL)-5}" text-anchor="end" class="ct">Ziel 0.6</text>`;
 g+=`<path d="${path(y=>val(y,NO),y1)}" fill="none" stroke="var(--g3)" stroke-width="3" stroke-dasharray="3 3"/>`;
 if(opts&&opts.vo)g+=`<path d="${path(y=>val(y,VO),y1)}" fill="none" stroke="var(--g2)" stroke-width="3"/>`;
 g+=`<path d="${path(y=>val(y,ACT),toYear)}" fill="none" stroke="var(--ink)" stroke-width="4"/>`;
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" shape-rendering="crispEdges" role="img" aria-label="Verlauf des Fussabdrucks">${g}</svg>
 <div class="legend"><span class="k"><i style="background:var(--ink)"></i>du</span>${opts&&opts.vo?`<span class="k"><i style="background:var(--g2)"></i>ohne eigene Karten</span>`:""}<span class="k"><i style="background:var(--g3)"></i>nur Trend</span><span class="k">- - Ziel 0.6 t</span></div>`;}

/* Spielgefühl: Zahl zählt, Balken wandert */
let LASTFOOT=null,LASTW=null;
function juice(){
 if(typeof document==="undefined"||!document.getElementById)return;
 const el=document.getElementById("footv");
 if(el&&el.dataset){const to=parseFloat(el.dataset.v);
  if(LASTFOOT!=null&&Math.abs(to-LASTFOOT)>=0.005){const from=LASTFOOT,steps=6;let i=0;
   el.textContent=fmt(from)+" t";
   const iv=setInterval(()=>{i++;el.textContent=fmt(from+(to-from)*i/steps)+" t";if(i>=steps)clearInterval(iv)},55);
   const fd=document.getElementById("fdelta");if(fd){fd.textContent=sgn(to-from)+" t";fd.classList.remove("go");void fd.offsetWidth;fd.classList.add("go");}}
  LASTFOOT=to;}
 const segs=(document.querySelectorAll&&typeof requestAnimationFrame!=="undefined")?document.querySelectorAll(".top .seg"):[];
 if(segs.length){const nw=[...segs].map(s=>s.style.width);
  if(LASTW&&LASTW.length==segs.length){segs.forEach((s,i)=>{s.style.transition="none";s.style.width=LASTW[i]});
   requestAnimationFrame(()=>requestAnimationFrame(()=>segs.forEach((s,i)=>{s.style.transition="";s.style.width=nw[i]})));}
  LASTW=nw;}
}

let NET=null;
async function netInit(){
 if(NET)return NET;
 if(typeof window!=="undefined"&&window.__FAKENET){NET=window.__FAKENET();await NET.init();return NET;}
 const A=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`);
 const U=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`);
 const D=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-database.js`);
 const app=A.initializeApp(FBCONF),auth=U.getAuth(app),db=D.getDatabase(app);
 const cred=await U.signInAnonymously(auth);
 const r=p=>D.ref(db,p);
 NET={uid:cred.user.uid,
  set:(p,v)=>D.set(r(p),v), update:(p,v)=>D.update(r(p),v), remove:p=>D.remove(r(p)),
  get:async p=>(await D.get(r(p))).val(),
  watch:(p,cb)=>D.onValue(r(p),s=>cb(s.val())),
  txn:async(p,fn)=>(await D.runTransaction(r(p),fn)).committed,
  onDisc:(p,v)=>D.onDisconnect(r(p)).update(v),
  now:{".sv":"timestamp"},
  cleanup:async()=>{const q=D.query(r("rooms"),D.orderByChild("createdAt"),D.endAt(Date.now()-86400000),D.limitToFirst(20));
   const s=await D.get(q);const v=s.val()||{};for(const k in v)await D.remove(r("rooms/"+k));}};
 return NET;
}

const COLORS=["blau","rot","grün","gelb","violett","orange","grau","braun","türkis","rosa","schwarz","weiss"];
const ABC="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let ROOM=null, UNWATCH=null;

const Group={
 async create(){
  try{S.netErr=null;await netInit();await NET.cleanup().catch(()=>{});
   let code;for(let i=0;i<5;i++){code=Array.from({length:5},()=>ABC[Math.floor(Math.random()*ABC.length)]).join("");
    if(!(await NET.get("rooms/"+code)))break;}
   const kl=((document.getElementById&&document.getElementById("klasse")&&document.getElementById("klasse").value)||"").replace(/[^A-Za-z0-9]/g,"").slice(0,6);
   await NET.set("rooms/"+code,{createdAt:NET.now,host:NET.uid,mode:S.mode||"kurz",status:"lobby",klasse:kl});
   await Group.enter(code);
  }catch(e){S.netErr="Verbindung nicht möglich ("+(e.code||e.message)+"). Spielt sonst allein.";render();}
 },
 async join(code){
  code=String(code||"").trim().toUpperCase();
  if(!/^[A-Z0-9]{5}$/.test(code)){S.netErr="Der Code hat fünf Zeichen.";render();return;}
  try{S.netErr=null;await netInit();const room=await NET.get("rooms/"+code);
   if(!room){S.netErr="Diesen Raum gibt es nicht.";render();return;}
   if(room.status!=="lobby"&&!(room.players&&room.players[NET.uid])){S.netErr="Dieses Spiel hat schon begonnen.";render();return;}
   await Group.enter(code);
  }catch(e){S.netErr="Verbindung nicht möglich ("+(e.code||e.message)+").";render();}
 },
 async enter(code){
  const base="rooms/"+code+"/players/"+NET.uid;
  const room=await NET.get("rooms/"+code);
  const me=room.players&&room.players[NET.uid];
  if(!me){let order=0;
   await NET.txn("rooms/"+code+"/seq",cur=>{order=(cur||0);return order+1;});
   await NET.set(base,{color:COLORS[order]||("Nr. "+(order+1)),order,online:true,fig:""});}
  else await NET.update(base,{online:true});
  NET.onDisc(base,{online:false});
  G=makeG(code);
  S.screen="lobby";
  if(UNWATCH)UNWATCH();
  UNWATCH=NET.watch("rooms/"+code,v=>{ROOM=v;onRoom();});
 },
 pickFig(f){NET.update("rooms/"+G.code+"/players/"+NET.uid,{fig:f});},
 setMode(m){NET.update("rooms/"+G.code,{mode:m});},
 async start(){
  const ps=Object.keys(ROOM.players).filter(u=>ROOM.players[u].online!==false);
  setMode(ROOM.mode);
  await NET.update("rooms/"+G.code,{status:"play",n:ps.length,ballot0:pickBallot({},[])});
 },
 viewLobby(){
  if(!ROOM)return `<div class="wrap"><p>Verbinde …</p></div>`;
  const ps=G.players(),me=ROOM.players[NET.uid]||{},host=ROOM.host===NET.uid;
  const ready=ps.length>=1&&ps.every(p=>p.fig);
  return `<div class="wrap"><div class="lbl">13 Tonnen · Gruppenspiel</div><h1 style="margin:4px 0 14px">Raum ${G.code}</h1>
  <div class="boxes"><div class="ibox hi"><div class="lbl">Code für die anderen</div><div class="code">${G.code}</div></div>
  <div class="ibox"><div class="lbl">Version</div>${host?`<div class="tabs" style="margin:8px 0 0">
   <label class="tab ${ROOM.mode=="kurz"?"on":""}" style="cursor:pointer"><input type="radio" style="display:none" onchange="Group.setMode('kurz')"><span class="n">4</span>Kurz</label>
   <label class="tab ${ROOM.mode=="lang"?"on":""}" style="cursor:pointer"><input type="radio" style="display:none" onchange="Group.setMode('lang')"><span class="n">8</span>Lang</label></div>`:`<div class="v" style="font-family:var(--titel);font-weight:800;font-size:28px">${ROOM.mode=="lang"?"Lang":"Kurz"}</div><div class="hint">wählt, wer den Raum eröffnet hat</div>`}</div></div>
  <div class="callout"><span class="ic">!</span><span>Gruppenziel: Durchschnitt 2050 unter ${fmt(GOAL)} t. Ihr gewinnt oder verliert gemeinsam.</span></div>${ROOM.klasse?`<div class="lbl">Klasse ${esc0(ROOM.klasse)}</div>`:""}<div class="sec"><h2>Mitspielende</h2></div><table><tr><th>Farbe</th><th>Figur</th><th></th></tr>${ps.map(p=>`<tr><td>${p.color}${p.uid===NET.uid?" (du)":""}</td><td>${p.fig?`<span class="row" style="gap:8px">${figImg(p.fig,1)}${p.fig}</span>`:"<span class='hint'>wählt noch</span>"}</td><td class="hint">${p.online===false?"offline":""}</td></tr>`).join("")}</table>
  <div class="sec"><h2>Deine Figur</h2></div><div class="figs">${Object.keys(M.FIG).map(f=>figCard(f,`Group.pickFig('${f}')`,me.fig==f)).join("")}</div>
  <div class="row" style="margin-top:18px">${host?`<button class="primary" ${ready?"":"disabled"} onclick="Group.start()">Spiel starten (${ps.length} ${ps.length==1?"Person":"Personen"})</button><span class="hint">Starten geht, sobald alle eine Figur gewählt haben.</span>`:`<span class="hint">Warten, bis das Spiel gestartet wird …</span>`}
  <button onclick="G.leave();fresh();render()">Raum verlassen</button></div></div>`;
 }
};

function pickBallot(adopted,prev){
 let pool=Object.keys(M.VORL).filter(k=>adopted[k]===undefined&&!prev.includes(k));
 if(pool.length<2)pool=Object.keys(M.VORL).filter(k=>adopted[k]===undefined);
 const b=[];while(b.length<2&&pool.length)b.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
 return b;
}
function adoptedFrom(room){
 const a={};const st=room.stage||{};
 for(const r in st)for(const x of (st[r].res||[]))if(x.ok)a[x.k]=vorlFrom(+r);
 return a;
}

function makeG(code){
 return {code,
  n(){return (ROOM&&ROOM.n)||1},
  players(){const p=(ROOM&&ROOM.players)||{};return Object.keys(p).map(u=>({uid:u,...p[u]})).sort((a,b)=>a.order-b.order)},
  myColor(){return ROOM&&ROOM.players[NET.uid]?ROOM.players[NET.uid].color:""},
  path(){return "rooms/"+code+"/players/"+NET.uid},
  totals(k){let h=0,d=0;const r=S.r;
   for(const p of this.players()){
    if(p.uid===NET.uid){h+=S.alloc[k]||0;d+=S.don[k]?1:0;continue;}
    const a=p.alloc&&p.alloc[r];const dn=p.don&&p.don[r];
    h+=(a&&a[k])||0;d+=(dn&&dn[k])||0;}
   return {h,d};},
  push(){NET.update(this.path(),{["alloc/"+S.r]:S.alloc,["don/"+S.r]:S.don});},
  ballotFor(r){const b=r==0?ROOM.ballot0:(ROOM.stage&&ROOM.stage[r-1]&&ROOM.stage[r-1].next);
   S.ballot=b||[];S.alloc={};S.don={};S.ballot.forEach(k=>{S.alloc[k]=0;S.don[k]=0});this.push();},
  ready(){S.waiting=true;NET.update(this.path(),{["alloc/"+S.r]:S.alloc,["don/"+S.r]:S.don,["ready/"+S.r]:true});render();tryResolve();},
  unready(){if(ROOM.stage&&ROOM.stage[S.r])return;S.waiting=false;NET.update(this.path(),{["ready/"+S.r]:false});render();},
  active(){return this.players().filter(p=>p.online!==false&&p.fig)},
  missing(){return this.active().filter(p=>p.uid!==NET.uid&&!(p.ready&&p.ready[S.r])).map(p=>p.fig+" ("+p.color+")")},
  finish(){if(S.finished)return;S.finished=true;
   const Y=2050;NET.update(this.path(),{end:{v:+val(Y,ACT).toFixed(2),sum:Math.round(sum(2026,Y,ACT)),
    own:+(val(Y,ACT)-val(Y,VO)).toFixed(2),cards:Object.keys(S.chosen).length}});},
  endTable(){const ps=this.players();const vo=val(2050,VO);
   const ga=groupAvg("end");
   return `<h2>Eure Gruppe</h2><div class="callout"><span class="ic">${ga!=null&&ga<GOAL?"✓":"!"}</span><span>Gruppenziel: Durchschnitt 2050 unter ${fmt(GOAL)} t. Ihr liegt bei <b>${ga==null?"–":fmt(ga)+" t"}</b>${ga!=null?(ga<GOAL?", geschafft.":", knapp verfehlt oder noch nicht fertig."):"."}</span></div><p class="hint">Alle in der Gruppe profitieren gleich von den angenommenen Vorlagen. Ohne eigene Karten stünde jede Figur 2050 bei ${fmt(vo)} t.</p>
   <table><tr><th>Figur</th><th class="n">2050 pro Jahr</th><th class="n">davon eigene Entscheide</th><th class="n">Summe bis 2050</th><th class="n">Karten</th></tr>
   ${ps.map(p=>`<tr><td><span class="row" style="gap:8px">${figImg(p.fig,1)}${p.fig} (${p.color})</span>${p.uid===NET.uid?" · du":""}</td>${p.end?`<td class="n">${fmt(p.end.v)}</td><td class="n">${sgn(p.end.own)}</td><td class="n">${p.end.sum}</td><td class="n">${p.end.cards}</td>`:`<td colspan="4" class="hint">spielt noch</td>`}</tr>`).join("")}</table>`;},
  leave(){if(UNWATCH)UNWATCH();UNWATCH=null;NET.update(this.path(),{online:false});G=null;ROOM=null;}
 };
}

async function tryResolve(){
 if(!G||!ROOM)return;const r=S.r;
 if(ROOM.stage&&ROOM.stage[r])return;
 const act=G.active();
 if(!act.every(p=>p.uid===NET.uid?S.waiting:(p.ready&&p.ready[r])))return;
 const ballot=r==0?ROOM.ballot0:ROOM.stage[r-1].next;
 const adoptedBefore=adoptedFrom(ROOM);
 await NET.txn("rooms/"+G.code+"/stage/"+r,cur=>{
  if(cur)return;  // schon entschieden
  const res=ballot.map(k=>{const c=chance(k),roll=Math.floor(Math.random()*100);return {k,c,ok:roll<c,roll}});
  const ad={...adoptedBefore};res.forEach(x=>{if(x.ok)ad[x.k]=1});
  const contrib={};for(const p of act){const a=p.uid===NET.uid?S.alloc:((p.alloc||{})[r]||{});const dn=p.uid===NET.uid?S.don:((p.don||{})[r]||{});
   contrib[p.uid]={fig:p.fig,color:p.color,h:Object.values(a).reduce((x,y)=>x+(y||0),0),d:Object.values(dn).reduce((x,y)=>x+(y||0),0)};}
  return {res,contrib,next:r<LAST?pickBallot(ad,ballot):[]};
 });
}

function onRoom(){
 if(!ROOM||!G){return;}
 if(S.screen==="lobby"){
  if(ROOM.status==="play"){
   const me=ROOM.players[NET.uid];
   S.mode=ROOM.mode;setMode(ROOM.mode);
   S.fig=me.fig;S.r=0;S.money=M.START[S.fig];beginRound();return;
  }
  render();return;
 }
 S.adopted=adoptedFrom(ROOM);
 const st=ROOM.stage&&ROOM.stage[S.r];
 if(S.screen==="round"){
  if(st&&!S.results){
   S.results=st.res;S.waiting=false;freeRide();
   S.log.push({r:S.r,cards:[...S.thisRound],votes:S.results,hearts:Object.values(S.alloc).reduce((a,b)=>a+b,0),don:Object.values(S.don).reduce((a,b)=>a+b,0)*SPENDE});
   render();return;
  }
  if(S.waiting)tryResolve();
  const y=window.scrollY;render();window.scrollTo(0,y);
 }
 if(S.screen==="end")render();
}
