<style>
:root{
 --titel:"Jersey 10",ui-sans-serif,sans-serif;--fliess:"Open Sans",ui-sans-serif,sans-serif;--mono:"Silkscreen",ui-monospace,monospace;
 --text:#352e2a;--muted:#7b726c;--faint:#a89f99;--line:#ebe6e1;--edge:#bdb5ae;--ink:#3b322e;--ink-h:#2b2420;--hover:#f3eee9;--soft:#f8f5f1;
 --g1:#3b322e;--g2:#6f6560;--g3:#9f9690;--g4:#c9c2bc;--g5:#e7e2dd;
 --hatch:repeating-linear-gradient(135deg,rgba(55,53,47,.22) 0 1.5px,transparent 1.5px 6px);
}
*{box-sizing:border-box}
body{font-synthesis:none;margin:0;background:#fff;color:var(--text);font-family:var(--fliess);line-height:1.5;font-size:15px}
h1,h2,h3{font-family:var(--titel);margin:0;font-weight:400!important;letter-spacing:0!important}
h1{font-size:40px;line-height:1}
h2{font-size:30px;line-height:1.05;margin:0 0 4px}
h3{font-size:20px;line-height:1.15}
p{margin:0 0 10px}
.num,.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);text-transform:uppercase;letter-spacing:.02em;font-size:12px;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 14px;max-width:900px}
.hint{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;font-size:14px;border:1px solid var(--edge);background:#fff;color:var(--text);padding:6px 12px;border-radius:0;cursor:pointer}
button:hover{background:var(--hover)}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
button.primary:hover{background:var(--ink-h)}
button:disabled{opacity:.4;cursor:default;background:#fff}
button.small{padding:2px 10px;font-size:13px}
input[type=radio],input[type=checkbox]{accent-color:var(--ink)}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
main{max-width:none;margin:0;padding:0}
.wrap{padding:24px 32px 90px;max-width:1360px;margin:0 auto}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top-in{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding:12px 32px 8px;max-width:1360px;margin:0 auto}
.who{display:flex;gap:12px;align-items:center}
.who .kick{font-family:var(--mono);font-size:12px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.who h1{font-size:40px}
.stats{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.st{border:1px solid var(--edge);padding:6px 14px;min-width:130px}
.st .v{font-family:var(--titel);font-weight:400;font-size:30px;line-height:1.15;white-space:nowrap}
.st.big{min-width:170px;border-color:var(--ink)}
.st.big .v{font-size:28px}
.st .s{font-size:12px;color:var(--muted)}
.pips{display:flex;gap:3px;margin-top:5px}
.amt{white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
img.icn{image-rendering:pixelated;vertical-align:-2px;display:inline-block}
img.icn.dim{opacity:.3}
.pips img.icn{margin:0}
.st .v img.icn{vertical-align:-1px}
.pips i{width:12px;height:12px;border:1px solid var(--ink);display:block}
.pips i.f{background:var(--ink)}
.barbox{padding:0 32px 12px;max-width:1360px;margin:0 auto}
.bar{position:relative;height:16px;display:flex;background:#fff;border:1px solid var(--edge)}
.seg{position:relative;height:100%;border-right:1px solid #fff}
.seg::after{content:"";position:absolute;inset:0;background:var(--hatch)}
.mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:2px 18px;margin-top:6px;font-family:var(--mono);font-size:12px;letter-spacing:0;color:var(--muted);text-transform:uppercase}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.legend i{position:relative;display:inline-block;width:12px;height:12px}
.legend i::after{content:"";position:absolute;inset:0;background:var(--hatch)}
.legend b{color:var(--text);font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.tab{display:flex;align-items:center;gap:10px;border:1px solid var(--edge);padding:5px 12px 5px 5px;font-size:14px;background:#fff}
.tab .n{font-family:var(--mono);font-size:12px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--hover);color:var(--muted)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on .n{background:#fff;color:var(--ink)}
.callout{display:flex;gap:10px;background:var(--soft);padding:10px 14px;margin:8px 0;font-size:14px}
.callout .ic{width:20px;flex:0 0 20px;height:20px;background:#e7e1db;color:#62584f;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
.panel{position:sticky;top:150px;max-height:calc(100vh - 160px);overflow:auto;border:1px solid var(--edge);padding:16px 18px;background:#fff}
.panel hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;border:1px solid var(--edge);padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:6px;min-height:170px}
.card:hover{border-color:var(--ink)}
.card.on{box-shadow:0 0 0 2px var(--ink);border-color:var(--ink)}
.card.off{color:var(--faint)}
.card.off .ti,.card.off .pts{color:var(--faint)}
.card .stripe{position:absolute;left:-1px;top:-1px;bottom:-1px;width:5px}
.card .stripe::after{content:"";position:absolute;inset:0;background:var(--hatch)}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .pts{font-family:var(--titel);font-weight:400;font-size:20px;white-space:nowrap}
.card .ti,.vote .ti{font-family:var(--titel);font-weight:400;font-size:20px;line-height:1.1;margin:2px 0 4px}
.card .tx{font-size:14px}
.card .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.cost{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.why{font-size:12.5px;color:var(--muted);font-style:italic}
details{font-size:13px;color:var(--text)}
details p{margin:6px 0 0}
summary{cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.02em;text-transform:uppercase}
.vote{border-top:1px solid var(--line);padding:12px 0}
table.pts td:first-child{width:60%}table.board tr.me td{background:var(--soft);font-weight:700}
.board td,.board th{white-space:nowrap}.board td:nth-child(3){white-space:normal}
.crisis{margin:0 0 18px;padding:14px 16px;background:var(--paper,#fff);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);position:relative}
.crisis::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 7px)}
.crisis .lbl{margin-top:6px}
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end;margin-bottom:8px}
h1.big{font-size:80px;line-height:.9;margin:6px 0 12px}
.herobox{display:flex;align-items:center;gap:14px}.herobox .ibox{min-width:170px}.herobox .arrow{font-family:var(--titel);font-size:40px;color:var(--g3)}
.step{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:var(--ink);color:#fff;font-size:20px;margin-right:12px;vertical-align:3px}
.setrow{display:flex;gap:28px;flex-wrap:wrap;align-items:center}.setrow .tabs{margin:0}
.figs.five{grid-template-columns:repeat(5,1fr)}
.fig{flex-direction:column;align-items:stretch;gap:0;padding:14px 16px 12px}
.fig .im{align-self:stretch;display:flex;justify-content:center;padding:14px 0 10px;margin:0 0 12px!important}
.fig h3{font-size:30px;margin:0 0 6px;line-height:1}
.fig .life{font-size:14px;margin:0 0 10px;flex:1}
.fig .fmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-bottom:6px}.fig .fmeta span{display:inline-flex;align-items:center;gap:4px}
.fig .fwish{font-size:13px;display:flex;gap:6px;align-items:flex-start;margin-bottom:10px;min-height:36px}.fig .fwish img{margin-top:2px}

const FARBE=false;
const ICK={"Mobilität":"mobil","Wohnen":"wohnen","Ernährung":"ernaehrung","Konsum und Freizeit":"konsum","Öffentliche Leistungen":"oeffentlich"};
const AREAK={I:"mobil",W:"wohnen",N:"ernaehrung",C:"konsum"};
function ico(k,s=16){return `<img class="px" src="${(FARBE?SPR.icoc:SPR.ico)[k]}" width="${s}" height="${s}" alt="">`}
function figAnim(f,sc=4,kind="idle"){const a=SPR.anim&&SPR.anim[f];if(!a||FARBE)return figImg(f,sc);const h=kind==="walk"?24:22;
 return `<span class="fa ${kind}" role="img" aria-label="${f}" style="width:${17*sc}px;height:${h*sc}px;background-image:url(${a[kind]})"></span>`;}
/* ---------- Bewegung: Sprechblasen, Hüpfer, Gang durch die Zeit ---------- */
let FX=[];
function fx(...k){FX.push(...k);}
const RM=()=>typeof window!=="undefined"&&window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function bubble(html,ms=1300,delay=0){if(RM()||!document.body||!document.querySelector)return;setTimeout(()=>{const f=document.querySelector(".who .fa,.who img.px");if(!f||!f.getBoundingClientRect)return;const r=f.getBoundingClientRect();
 const b=document.createElement("div");b.className="bub";b.innerHTML=html;b.style.left=(r.right+6)+"px";b.style.top=(r.top+2)+"px";document.body.appendChild(b);setTimeout(()=>b.remove(),ms);},delay);}
function figClass(c,ms=600,delay=0){if(RM()||!document.querySelector)return;setTimeout(()=>{const f=document.querySelector(".who .fa");if(!f)return;f.classList.remove(c);void f.offsetWidth;f.classList.add(c);setTimeout(()=>f.classList.remove(c),ms);},delay);}
const FXS={check:[18,14],spark:[14,14],bang:[4,14],dots:[16,4]};const FXI=k=>`<img class="px fxi" src="${SPR.fx[k]}" width="${FXS[k][0]}" height="${FXS[k][1]}" alt="">`;
function sparks(delay=0){if(RM()||!document.querySelector)return;setTimeout(()=>{const f=document.querySelector(".who .fa");if(!f||!f.getBoundingClientRect)return;const r=f.getBoundingClientRect();
 for(let i=0;i<5;i++){const s=document.createElement("div");s.className="spark";s.innerHTML=FXI("spark");s.style.left=(r.left+r.width/2)+"px";s.style.top=(r.top+r.height*0.3)+"px";
  const a=-Math.PI/2+(i-2)*0.55;s.style.setProperty("--dx",Math.round(Math.cos(a)*48)+"px");s.style.setProperty("--dy",Math.round(Math.sin(a)*48)+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),700);}},delay);}
function applyFx(){const k=FX;FX=[];if(typeof document==="undefined"||!document.querySelector)return;
 for(const e of k){
  if(e==="hop"){figClass("hop",400);bubble(FXI("check"),900);}
  else if(e==="heart"){bubble(IC("herz",16),800);}
  else if(e==="yay"){figClass("hop",400,1300);sparks(1350);bubble(FXI("bang")+FXI("bang"),1400,1300);}
  else if(e==="sad"){figClass("sad",1200,1300);bubble(FXI("dots"),1500,1300);}
  else if(e==="bang"){figClass("shake",500,350);bubble(FXI("bang"),1400,350);}
  else if(e==="wishgone"){bubble(`<span class="wb">${IC("herz",12,true)}</span>`+FXI("dots"),1500);}
  else if(e==="walk")walkOverlay();
  else if(e==="end"){const ok=val(2050,ACT)<6&&sum(2026,2050,ACT)<200,mid=val(2050,ACT)<val(2050,NO);const d=RM()?0:2500;
   if(ok){figClass("hop",400,d);sparks(d+50);bubble(FXI("bang")+FXI("bang"),1400,d);}else if(mid){figClass("hop",400,d);bubble(FXI("check"),1200,d);}else{figClass("sad",1200,d);bubble(FXI("dots"),1500,d);}}}}
function walkOverlay(){if(RM()||!document.body||!document.createElement)return;
 const yrs=PER.map(p=>p.a).concat([2050]),to=S.screen==="end"?yrs.length-1:S.r,from=Math.max(0,to-1);
 const W=Math.min(640,(window.innerWidth||800)-60),x=i=>20+i*(W-60)/(yrs.length-1);
 const o=document.createElement("div");o.className="walkov";o.onclick=()=>o.remove();
 o.innerHTML=`<div class="walkbox" style="width:${W}px"><div class="lbl">${S.screen==="end"?"Angekommen":"Die Zeit vergeht"}</div><div class="track">${yrs.map((y,i)=>`<span class="yr ${i<=to?"on":""}" style="left:${x(i)}px">${y}</span>`).join("")}<div class="path"></div>
 <div class="walker" style="left:${x(from)-26}px">${figAnim(S.fig,3,"walk")}</div></div></div>`;
 document.body.appendChild(o);const w=o.querySelector(".walker");
 requestAnimationFrame(()=>requestAnimationFrame(()=>{w.style.left=(x(to)-26)+"px";}));
 setTimeout(()=>{const fa=w.querySelector(".fa");if(fa&&SPR.anim[S.fig]){fa.className="fa idle";fa.style.backgroundImage=`url(${SPR.anim[S.fig].idle})`;fa.style.height=(22*3)+"px";}},1500);
 setTimeout(()=>{o.classList.add("out");setTimeout(()=>o.remove(),300);},2300);}
function wanderFig(f,sc=4){if(!SPR.anim||!SPR.anim[f]||FARBE)return figImg(f,sc);const a=SPR.anim[f];
 return `<span class="wander" data-f="${f}" data-sc="${sc}"><span class="fa idle" style="width:${17*sc}px;height:${22*sc}px;background-image:url(${a.idle})"></span><span class="fa walk" style="width:${17*sc}px;height:${24*sc}px;background-image:url(${a.walk})"></span></span>`;}
const PLAYMS={jump:650,duck:800,look:1300,look2:1150};
function playAnim(inn,f,sc,kind,done){const a=SPR.anim[f],m=SPR.animMeta&&SPR.animMeta[kind];if(!a||!a[kind]||!m){done&&done(false);return false;}
 const ms=PLAYMS[kind];inn.className="fa play";Object.assign(inn.style,{backgroundImage:`url(${a[kind]})`,width:m.w*sc+"px",height:m.h*sc+"px",marginLeft:m.dx*sc+"px",backgroundSize:(m.n*100)+"% 100%",animation:`playA ${ms}ms steps(${m.n}) forwards`});inn.style.setProperty("--e",(m.n/(m.n-1)*100)+"%");
 setTimeout(()=>{if(inn.isConnected){inn.className="fa idle";Object.assign(inn.style,{backgroundImage:`url(${a.idle})`,width:17*sc+"px",height:22*sc+"px",marginLeft:"0",backgroundSize:"",animation:""});}done&&done(true);},ms);return true;}
let WT=null,WLAST=0;
function wanderTick(ts){if(typeof requestAnimationFrame!=="undefined")requestAnimationFrame(wanderTick);if(RM()||!document.querySelectorAll)return;
 const now=Date.now(),dt=Math.min(0.1,WLAST?(now-WLAST)/1000:0);WLAST=now;
 document.querySelectorAll(".stage").forEach(st=>{const ws=[...st.querySelectorAll(".wander")];const W=st.clientWidth;if(!W)return;

 return {b:+(sum(2026,2050,NO)-sum(2026,2050,ACT)).toFixed(1),e:+(no-a).toFixed(2),m:S.money};}
function scoreOf(o){ // o: {b,e,m (Schnitt pro Person), v,p (Gruppe), ziel}
 const r={B:Math.round(o.b*PTS.B),E:Math.round(o.e*PTS.E),V:o.v*PTS.V,P:o.p*PTS.P,Z:o.ziel?PTS.ZIEL:0,M:Math.round(o.m*PTS.M)};
 r.tot=Math.max(0,r.B+r.E+r.V+r.P+r.Z+r.M);return r;}
function scoreNow(){ // null, wenn in der Gruppe noch nicht alle fertig sind
 const v=Object.keys(S.adopted).length,p=Object.keys(S.pdone||{}).length;
 if(!G){const x=myParts();return {n:1,...x,v,p,ziel:false};}
 const ps=G.players().filter(q=>q.fig);if(ps.some(q=>!q.end||q.end.b==null))return null;
 const av=k=>ps.reduce((s,q)=>s+q.end[k],0)/ps.length;
 const ga=groupAvg("end"),gb=groupAvg("endsum");
 return {n:ps.length,b:av("b"),e:av("e"),m:av("m"),v,p,ziel:ga!=null&&gb!=null&&ga<GOAL&&gb<GOALB};}
let BOARD={key:null,rows:null,err:null};
function boardKey(n,mode){return "scores/"+(mode||S.mode||"kurz")+"/"+n;}
async function loadBoard(n,mode){const k=boardKey(n,mode);BOARD={key:k,rows:null,err:null};render();
 try{await netInit();const v=await NET.top(k,10);BOARD={key:k,rows:v,err:null};}
 catch(e){BOARD={key:k,rows:[],err:"Bestenliste nicht erreichbar"+(e&&e.code?" ("+e.code+")":"")+"."};}
 render();}
async function submitScore(){
 const o=scoreNow();if(!o||S.scored)return;const sc=scoreOf(o);
 const kzEl=document.getElementById&&document.getElementById("kz");
 const kz=((kzEl&&kzEl.value)||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,3);
 const figs=G?G.players().filter(q=>q.fig).map(q=>q.fig).join(","):S.fig;
 const kl=G&&ROOM&&ROOM.klasse?ROOM.klasse:"";
 const row={s:sc.tot,b:sc.B,e:sc.E,g:sc.V+sc.P+sc.Z,m:sc.M,kz,kl,figs,ch:S.chal||"keine",at:NET&&NET.now||Date.now()};
 S.scored="sending";render();
 try{await netInit();
  if(G){const ok=await NET.txn("rooms/"+G.code+"/scored",cur=>cur?undefined:NET.uid);
   if(!ok){S.scored="done";S.scoreMsg="Eure Gruppe ist schon eingetragen.";await loadBoard(o.n);return;}}
  S.scoreId=await NET.push(boardKey(o.n),row);S.scored="done";S.scoreMsg=null;await loadBoard(o.n);}
 catch(e){S.scored=null;S.scoreMsg="Eintragen nicht möglich"+(e&&e.code?" ("+e.code+")":"")+". Die Lehrperson muss die Regeln in Firebase ergänzen.";render();}}
function boardTable(n){const myId=S.scoreId;
 if(BOARD.key!==boardKey(n))return `<p class="hint">Lade …</p>`;
 if(BOARD.err)return `<p class="hint">${esc0(BOARD.err)}</p>`;
 if(!BOARD.rows)return `<p class="hint">Lade …</p>`;
 if(!BOARD.rows.length)return `<p class="hint">Noch keine Einträge. Ihr könnt die ersten sein.</p>`;
 return `<table class="board"><tr><th>#</th><th>Kürzel</th><th>${n>1?"Figuren":"Figur"}</th><th>Klasse</th><th class="n">CO₂</th><th class="n">2050</th><th class="n">Gruppe</th><th class="n">Geld</th><th class="n">Punkte</th></tr>
 ${BOARD.rows.map((r,i)=>`<tr class="${r.id===myId?"me":""}"><td class="mono">${i+1}</td><td class="mono">${esc0(r.kz||"–")}</td><td>${esc0(r.figs||"")}${r.ch&&r.ch!="keine"?` <span class="hint">· ${esc0((CHAL[r.ch]||{}).t||"")}</span>`:""}</td><td class="mono">${esc0(r.kl||"")}</td><td class="n">${r.b}</td><td class="n">${r.e}</td><td class="n">${r.g}</td><td class="n">${r.m}</td><td class="n"><b>${r.s}</b></td></tr>`).join("")}</table>`;}
function scoreHTML(){const o=scoreNow();
 if(!o)return `<div class="sec"><h2>Punkte</h2></div><p class="hint">Sobald alle fertig sind, rechnet das Spiel eure Punkte.</p>`;
 const sc=scoreOf(o),n=o.n;if(BOARD.key!==boardKey(n)&&!BOARD.loading){BOARD.loading=true;setTimeout(()=>{BOARD.loading=false;loadBoard(n)},0);}
 const per=n>1?" im Schnitt pro Person":"";
 return `<div class="sec"><h2>Punkte</h2><p class="sub">${n>1?`Eure Gruppe zu ${n}: Gezählt wird der Schnitt pro Person und die gemeinsame Leistung.`:"Gezählt wird, was du gespart hast, wo du 2050 stehst und was politisch durchkam."}</p></div>
 <table class="pts"><tr><td>CO₂ gespart 2026 bis 2050${per}, gegenüber dem Trend</td><td class="n">${fmt(o.b,0)} t × ${PTS.B}</td><td class="n">${sc.B}</td></tr>
 <tr><td>2050 unter dem Trend${per}</td><td class="n">${fmt(o.e)} t × ${PTS.E}</td><td class="n">${sc.E}</td></tr>
 <tr><td>Angenommene Vorlagen</td><td class="n">${o.v} × ${PTS.V}</td><td class="n">${sc.V}</td></tr>
 <tr><td>Projekte im Quartier</td><td class="n">${o.p} × ${PTS.P}</td><td class="n">${sc.P}</td></tr>
 ${n>1?`<tr><td>Gruppenziel erreicht</td><td class="n">${o.ziel?"ja":"nein"}</td><td class="n">${sc.Z}</td></tr>`:""}
 <tr><td>Übriges Geld${per}</td><td class="n">${fmt(o.m,n>1?1:0)} × ${PTS.M}</td><td class="n">${sc.M}</td></tr>
 <tr class="sum"><td>Total</td><td></td><td class="n">${sc.tot}</td></tr></table>
 <div class="sec"><h2>Bestenliste: ${n==1?"allein":n+" Personen"}, ${S.mode=="lang"?"lang":"kurz"}</h2></div>
 ${S.scored=="done"?(S.scoreMsg?`<p class="hint">${esc0(S.scoreMsg)}</p>`:`<p class="hint">Eingetragen.</p>`):
  `<div class="row"><input id="kz" class="codein" style="width:5em" maxlength="3" placeholder="ABC" title="3 Buchstaben, kein Name"><button class="primary" ${S.scored?"disabled":""} onclick="submitScore()">${n>1?"Gruppe eintragen":"Eintragen"}</button><span class="hint">Kürzel mit 3 Buchstaben, kein Name.${n>1?" Eine Person trägt für alle ein.":""}</span></div>${S.scoreMsg?`<p class="hint">${esc0(S.scoreMsg)}</p>`:""}`}
 ${boardTable(n)}`;}
function viewBoard(){const n=S.boardN||1,m=S.boardMode||"kurz";
 if(BOARD.key!==boardKey(n,m)&&!BOARD.loading){BOARD.loading=true;setTimeout(()=>{BOARD.loading=false;loadBoard(n,m)},0);}
 const saved=S.mode;S.mode=m;const tb=boardTable(n);S.mode=saved;
 return `<div class="wrap"><div class="lbl">13 Tonnen</div><h1 style="margin:4px 0 8px">Bestenliste</h1>
 <p class="sub">Je eine Liste pro Gruppengrösse. In der Gruppe zählt der Schnitt pro Person plus die gemeinsame Leistung.</p>
 <div class="tabs">${[1,2,3,4,5].map(k=>`<button class="tab ${k==n?"on":""}" onclick="S.boardN=${k};render()"><span class="n">${k}</span>${k==1?"allein":k+" Personen"}</button>`).join("")}</div>
 <div class="tabs">${["kurz","lang"].map(k=>`<button class="tab ${k==m?"on":""}" onclick="S.boardMode='${k}';render()">${k=="kurz"?"Kurz":"Lang"}</button>`).join("")}</div>
 ${tb}
 <details style="margin-top:14px"><summary>So werden Punkte gerechnet</summary><p>${PTS.B} Punkte pro Tonne CO₂, die von 2026 bis 2050 weniger ausgestossen wird als im Trend. ${PTS.E} Punkte pro Tonne, die der Fussabdruck 2050 unter dem Trend liegt. ${PTS.V} Punkte pro angenommene Vorlage, ${PTS.P} pro Projekt im Quartier, in der Gruppe ${PTS.ZIEL} fürs Gruppenziel. ${PTS.M} Punkte pro übriges Geld. In der Gruppe zählen CO₂, 2050 und Geld im Schnitt pro Person.</p></details>
 <div class="row" style="margin-top:22px"><button onclick="S.screen='start';render()">Zurück</button></div></div>`;}

/* ---------- Ablauf ---------- */
const HAND=6;
function income(f,r){if(S.chal=="knapp")return 0;const c=M.INC[f];return c[r%c.length];}
function incText(f){const c=M.INC[f];return c.length==1?c[0]+" pro Runde":"1 jede zweite Runde";}
const usedH=()=>Object.values(S.alloc).reduce((a,b)=>a+b,0)+(S.palloc||0);
const freeH=()=>S.hearts-usedH();
function avail(id){ // kommt grundsätzlich noch in Frage (ohne Kosten)
 const f=fig(),c=M.CARDS[id];
 if(f.ban.includes(id)||chalBan(id)||S.chosen[id]!==undefined)return false;
 if((id=="W2"||id=="W2b")&&S.flags.w2locked)return false;
 for(const x of (c.excl||[]))if(S.chosen[x]!==undefined)return false;
 if((id=="I1a"||id=="I5")&&S.chosen.I1b!==undefined)return false;
 if(id=="N1"&&(S.chosen.N2!==undefined||S.chosen.N3!==undefined))return false;
 if(id=="N2"&&S.chosen.N3!==undefined)return false;
 return true;
}
function drawHand(){
 const pool=Object.keys(M.CARDS).filter(avail),hand=[];
 const take=id=>{if(pool.includes(id)&&!hand.includes(id))hand.push(id)};
 if(S.flags.e2==S.r)take("W2"); if(S.flags.e3==S.r)take("N2");
 if(S.nextEvent=="E2")take("W2"); if(S.nextEvent=="E4")take("C4");
 const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
 for(const a of "IWNC"){if(hand.length>=HAND)break;const c=shuf(pool.filter(k=>k[0]==a&&!hand.includes(k)));if(c.length)hand.push(c[0]);}
 for(const k of shuf(pool.filter(k=>!hand.includes(k)))){if(hand.length>=HAND)break;hand.push(k);}
 const ord="IWNC";hand.sort((x,y)=>ord.indexOf(x[0])-ord.indexOf(y[0]));
 S.hand=hand;
}
function startFig(f){S.fig=f;S.r=0;S.money=M.START[f];S.projList=pickProj();beginRound();}
function beginRound(){
 S.wishH=(wish()&&!wishBroken()&&wishBonusRound(S.r))?1:0;
 S.hearts=3+(S.carry||0)+S.wishH;S.money+=income(S.fig,S.r);S.thisRound=[];S.palloc=0;updPdone();announceEvent();drawHand();if(G)G.ballotFor(S.r);else drawBallot();S.results=null;S.event=null;S.waiting=false;
 let note=[];
 if(S.adopted.K6!==undefined&&S.adopted.K6<=PER[S.r].a){
  if(S.chosen.I1b!==undefined){S.money+=1;note.push("Flugticketabgabe: Du fliegst nicht mehr und bekommst 1 Geld zurück.");}
  else{const d=Math.min(1,S.money);S.money-=d;note.push("Flugticketabgabe: Du fliegst noch und zahlst 1 Geld.");}
 }
 if(S.freeNote){note.push(S.freeNote);S.freeNote=null;}
 if(S.carry||S.wishH)note.push("Diese Runde hast du "+S.hearts+" Herzen: 3"+(S.carry?", 1 mitgenommen":"")+(S.wishH?", 1 von deinem Wunsch":"")+".");
 S.carry=0;
 S.roundNote=note;
 S.snap[S.r]={y:PER[S.r].a,act:val(PER[S.r].a,ACT)};
 S.revealed=null;
 if(S.r==0&&!lsGet("13t_tut"))S.coach=0;
 if(G)NET.update(G.path(),{now:+val(PER[S.r].a,ACT).toFixed(2),sumnow:S.r?Math.round(sum(2026,PER[S.r].a-1,ACT)):0});
 S.screen="round";render();window.scrollTo(0,0);
}
function drawBallot(){
 const prev=S.ballot||[];let pool=Object.keys(M.VORL).filter(k=>S.adopted[k]===undefined&&!prev.includes(k));
 if(pool.length<2)pool=Object.keys(M.VORL).filter(k=>S.adopted[k]===undefined);
 S.ballot=[];while(S.ballot.length<2&&pool.length){S.ballot.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);}
 S.alloc={};S.don={};S.ballot.forEach(k=>{S.alloc[k]=0;S.don[k]=0});
}
const SPENDE=2,SPENDEP=15;
function chance(k){
 if(G){const g=G.totals(k);return Math.min(MAXC,Math.round(M.VORL[k].c*100+bonus(k)+g.h*30/G.n()+g.d*SPENDEP/G.n()));}
 return Math.min(MAXC,Math.round(M.VORL[k].c*100)+bonus(k)+S.alloc[k]*30+(S.don[k]?SPENDEP:0))}
function donate(k){if(S.results||S.waiting)return;if(S.don[k]){S.don[k]=0;S.money+=SPENDE;}else{if(S.money<SPENDE)return;S.don[k]=1;S.money-=SPENDE;}if(G)G.push();render();}
function alloc(k,d){if(S.results||S.waiting)return;
 if(d>0&&freeH()<=0)return;if(d<0&&S.alloc[k]==0)return;S.alloc[k]+=d;if(d>0)fx("heart");if(G)G.push();render();}
function freeRide(){}
function vote(){
 S.carry=Math.min(1,freeH());
 if(G){G.ready();return;}
 S.plog[S.r]=projState(S.r)&&!projState(S.r).done?(S.palloc||0):0;updPdone();
 S.results=S.ballot.map(k=>{const c=chance(k),roll=Math.floor(Math.random()*100);const ok=roll<c;
  if(ok)S.adopted[k]=vorlFrom(S.r);else{S.rejects=S.rejects||{};S.rejects[k]=(S.rejects[k]||0)+1;}return {k,c,ok,roll}});
 freeRide();
 S.log.push({r:S.r,cards:[...S.thisRound],votes:S.results,hearts:Object.values(S.alloc).reduce((a,b)=>a+b,0),proj:S.palloc||0,don:Object.values(S.don).reduce((a,b)=>a+b,0)*SPENDE});
 fx(S.results.some(x=>x.ok)?"yay":"sad");
 render();
}
function toEvent(){
 let e=S.nextEvent||"ruhig";
 if(e!=="ruhig"&&!eventCands().includes(e)){S.event="abgewendet";S.averted=e;}
 else{S.event=e;S.averted=null;
  const nextY=vorlFrom(S.r);
  if(e!=="ruhig"){S.happened.push(e);}
  if(e=="E1")S.events.push({id:"E1",from:nextY});
  if(e=="E2")S.flags.e2=S.r+1;
  if(e=="E3")S.flags.e3=S.r+1;
  if(e=="E4"){S.money=Math.max(0,S.money-2);S.events.push({id:"E4",from:nextY});}}
 S.log[S.log.length-1].event=S.event=="abgewendet"?"abgewendet":S.event;
 S.screen="event";render();window.scrollTo(0,0);
}
function nextRound(){
 if(S.flags.e2===S.r&&S.chosen.W2===undefined)S.flags.w2locked=true;
 fx("walk");
 if(S.r<LAST){S.r++;beginRound();}else{S.screen="end";fx("end");render();window.scrollTo(0,0);}
}

function vEff(k){const y=vorlFrom(S.r);return val(y,ACT)-val(y,{...ACT,extraVorl:k});}
function ballotHTML(){
 let h=`<div class="lbl">Abstimmungssonntag</div><h3 style="margin:2px 0 6px">Zwei Vorlagen</h3>
 <p class="hint">${G?`Ihr seid ${G.n()}: Ein Herz bringt +${fmt(30/G.n(),0)} Prozentpunkte, eine Kampagne (2 Geld) +${fmt(SPENDEP/G.n(),0)}. Es zählt die ganze Gruppe.`:`Ein Herz bringt +30 Prozentpunkte, eine Kampagne (2 Geld) +15.`} Angenommen wirkt ab ${vorlFrom(S.r)}.</p>`;
 for(const k of S.ballot){const t=T[k],r=S.results&&S.results.find(x=>x.k==k),c=chance(k);
  h+=`<div class="vote"><div class="hd" style="display:flex;justify-content:space-between;gap:8px"><span class="lbl">${vorlCat(k)?CATIC(vorlCat(k)):""}${strat(k)} · ${sgn(-vEff(k),2)} t für dich</span></div>
  <div class="ti">${esc(t.title)}</div><div class="tx" style="font-size:14px">${esc(t.front)}</div>
  <div class="row" style="justify-content:space-between;margin-top:6px"><span class="lbl">Chance</span><span class="chance">${c} %</span></div>

/* Verlaufskurve als Pixelgrafik */
function chartSVG(toYear,opts){
 const W=640,H=200,L=34,R=22,T=10,B=24,y0=2026,y1=2050,vmax=13.5;
 const X=y=>L+(y-y0)/(y1-y0)*(W-L-R), Y=v=>T+(1-v/vmax)*(H-T-B);

   <label class="tab ${ROOM.mode=="lang"?"on":""}" style="cursor:pointer"><input type="radio" style="display:none" onchange="Group.setMode('lang')"><span class="n">8</span>Lang</label></div>`:`<div class="v" style="font-family:var(--titel);font-weight:800;font-size:28px">${ROOM.mode=="lang"?"Lang":"Kurz"}</div><div class="hint">wählt, wer den Raum eröffnet hat</div>`}</div></div>
  <div class="callout"><span class="ic">!</span><span>Gruppenziel: im Schnitt 2050 unter ${fmt(GOAL)} t pro Jahr und ein Budget 2026 bis 2050 unter ${GOALB} t. Ihr gewinnt oder verliert gemeinsam.</span></div>${ROOM.klasse?`<div class="lbl">Klasse ${esc0(ROOM.klasse)}</div>`:""}<div class="sec"><h2>Mitspielende</h2></div><table><tr><th>Farbe</th><th>Figur</th><th></th></tr>${ps.map(p=>`<tr><td>${p.color}${p.uid===NET.uid?" (du)":""}</td><td>${p.fig?`<span class="row" style="gap:8px">${figImg(p.fig,1)}${p.fig}</span>`:"<span class='hint'>wählt noch</span>"}</td><td class="hint">${p.online===false?"offline":""}</td></tr>`).join("")}</table>
  <div class="sec"><h2>Deine Figur</h2></div><div class="figs">${Object.keys(M.FIG).map(f=>figCard(f,`Group.pickFig('${f}')`,me.fig==f)).join("")}</div>
  <div class="row" style="margin-top:18px">${host?`<button class="primary" ${ready?"":"disabled"} onclick="Group.start()">Spiel starten (${ps.length} ${ps.length==1?"Person":"Personen"})</button><span class="hint">Starten geht, sobald alle eine Figur gewählt haben.</span>`:`<span class="hint">Warten, bis das Spiel gestartet wird …</span>`}
  <button onclick="G.leave();fresh();render()">Raum verlassen</button></div></div>`;
 }
};

function pickBallot(adopted,prev){
 let pool=Object.keys(M.VORL).filter(k=>adopted[k]===undefined&&!prev.includes(k));
 if(pool.length<2)pool=Object.keys(M.VORL).filter(k=>adopted[k]===undefined);
 const b=[];while(b.length<2&&pool.length)b.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
 return b;
}
function adoptedFrom(room){
 const a={};const st=room.stage||{};
 for(const r in st)for(const x of (st[r].res||[]))if(x.ok)a[x.k]=vorlFrom(+r);
 return a;
}

function makeG(code){
 return {code,
  n(){return (ROOM&&ROOM.n)||1},
  players(){const p=(ROOM&&ROOM.players)||{};return Object.keys(p).map(u=>({uid:u,...p[u]})).sort((a,b)=>a.order-b.order)},
  myColor(){return ROOM&&ROOM.players[NET.uid]?ROOM.players[NET.uid].color:""},
  path(){return "rooms/"+code+"/players/"+NET.uid},
  totals(k){let h=0,d=0;const r=S.r;
   for(const p of this.players()){
    if(p.uid===NET.uid){h+=S.alloc[k]||0;d+=S.don[k]?1:0;continue;}
    const a=p.alloc&&p.alloc[r];const dn=p.don&&p.don[r];
    h+=(a&&a[k])||0;d+=(dn&&dn[k])||0;}
   return {h,d};},
  push(){NET.update(this.path(),{["alloc/"+S.r]:S.alloc,["don/"+S.r]:S.don,["palloc/"+S.r]:S.palloc||0});},
  ballotFor(r){const b=r==0?ROOM.ballot0:(ROOM.stage&&ROOM.stage[r-1]&&ROOM.stage[r-1].next);
   S.ballot=b||[];S.alloc={};S.don={};S.ballot.forEach(k=>{S.alloc[k]=0;S.don[k]=0});this.push();},
  ready(){S.waiting=true;NET.update(this.path(),{["alloc/"+S.r]:S.alloc,["don/"+S.r]:S.don,["palloc/"+S.r]:S.palloc||0,["ready/"+S.r]:true});render();tryResolve();},
  unready(){if(ROOM.stage&&ROOM.stage[S.r])return;S.waiting=false;NET.update(this.path(),{["ready/"+S.r]:false});render();},
  active(){return this.players().filter(p=>p.online!==false&&p.fig)},
  missing(){return this.active().filter(p=>p.uid!==NET.uid&&!(p.ready&&p.ready[S.r])).map(p=>p.fig+" ("+p.color+")")},
  finish(){if(S.finished)return;S.finished=true;
   const Y=2050;NET.update(this.path(),{end:{v:+val(Y,ACT).toFixed(2),sum:Math.round(sum(2026,Y,ACT)),
    own:+(val(Y,ACT)-val(Y,VO)).toFixed(2),cards:Object.keys(S.chosen).length,...myParts()}});},
  endTable(){const ps=this.players();const vo=val(2050,VO);
   const ga=groupAvg("end");const gb=groupAvg("endsum");const okA=ga!=null&&ga<GOAL,okB=gb!=null&&gb<GOALB;
   return `<h2>Eure Gruppe</h2><div class="callout"><span class="ic">${okA&&okB?"✓":"!"}</span><span>Gruppenziel: im Schnitt 2050 unter ${fmt(GOAL)} t und Budget unter ${GOALB} t. Ihr liegt bei <b>${ga==null?"–":fmt(ga)+" t"}</b> ${okA?"✓":"✗"} und <b>${gb==null?"–":fmt(gb,0)+" t"}</b> ${okB?"✓":"✗"}. ${okA&&okB?"Geschafft.":okA||okB?"Nur halb geschafft: Beides zählt.":"Nicht geschafft oder noch nicht fertig."}</span></div><p class="hint">Alle in der Gruppe profitieren gleich von den angenommenen Vorlagen. Ohne eigene Karten stünde jede Figur 2050 bei ${fmt(vo)} t.</p>
   <table><tr><th>Figur</th><th class="n">2050 pro Jahr</th><th class="n">davon eigene Entscheide</th><th class="n">Budget bis 2050</th><th class="n">Karten</th></tr>
   ${ps.map(p=>`<tr><td><span class="row" style="gap:8px">${figImg(p.fig,1)}${p.fig} (${p.color})</span>${p.uid===NET.uid?" · du":""}</td>${p.end?`<td class="n">${fmt(p.end.v)}</td><td class="n">${sgn(p.end.own)}</td><td class="n">${p.end.sum}</td><td class="n">${p.end.cards}</td>`:`<td colspan="4" class="hint">spielt noch</td>`}</tr>`).join("")}</table>`;},
  leave(){if(UNWATCH)UNWATCH();UNWATCH=null;NET.update(this.path(),{online:false});G=null;ROOM=null;}
 };
}

async function tryResolve(){
 if(!G||!ROOM)return;const r=S.r;
 if(ROOM.stage&&ROOM.stage[r])return;
 const act=G.active();
 if(!act.every(p=>p.uid===NET.uid?S.waiting:(p.ready&&p.ready[r])))return;
 const ballot=r==0?ROOM.ballot0:ROOM.stage[r-1].next;
 const adoptedBefore=adoptedFrom(ROOM);
 await NET.txn("rooms/"+G.code+"/stage/"+r,cur=>{
  if(cur)return;  // schon entschieden
  const res=ballot.map(k=>{const c=chance(k),roll=Math.floor(Math.random()*100);return {k,c,ok:roll<c,roll}});
  const ad={...adoptedBefore};res.forEach(x=>{if(x.ok)ad[x.k]=1});
  const contrib={};for(const p of act){const a=p.uid===NET.uid?S.alloc:((p.alloc||{})[r]||{});const dn=p.uid===NET.uid?S.don:((p.don||{})[r]||{});
   const pa=p.uid===NET.uid?(S.palloc||0):((p.palloc||{})[r]||0);
   contrib[p.uid]={fig:p.fig,color:p.color,h:Object.values(a).reduce((x,y)=>x+(y||0),0),d:Object.values(dn).reduce((x,y)=>x+(y||0),0),p:pa};}
  return {res,contrib,next:r<LAST?pickBallot(ad,ballot):[]};
 });
}

function onRoom(){
 if(!ROOM||!G){return;}
 if(S.screen==="lobby"){
  if(ROOM.status==="play"){
   const me=ROOM.players[NET.uid];
   S.mode=ROOM.mode;setMode(ROOM.mode);
   S.fig=me.fig;S.r=0;S.money=M.START[S.fig];beginRound();return;
  }
  render();return;
 }
 S.adopted=adoptedFrom(ROOM);updPdone();
 const st=ROOM.stage&&ROOM.stage[S.r];
 if(S.screen==="round"){
  if(st&&!S.results){
   S.results=st.res;S.waiting=false;freeRide();fx(S.results.some(x=>x.ok)?"yay":"sad");
   S.log.push({r:S.r,cards:[...S.thisRound],votes:S.results,hearts:Object.values(S.alloc).reduce((a,b)=>a+b,0),proj:S.palloc||0,don:Object.values(S.don).reduce((a,b)=>a+b,0)*SPENDE});
   render();return;
  }
  if(S.waiting)tryResolve();
  const y=window.scrollY;render();window.scrollTo(0,y);
 }
 if(S.screen==="end")render();
}

render();
if(typeof location!=="undefined"&&location.hash==="#lehrperson")openTeacher();
</script>

let ents=[],layer=null,S=.5,last=0,t0=0,cw=0,tw=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function roadY(x){x=((x%D.W)+D.W)%D.W;const i=x/4,a=Math.floor(i)%D.road.length,b=(a+1)%D.road.length,f=i-Math.floor(i);return D.road[a]*(1-f)+D.road[b]*f;}
function mk(st,cls){const e=document.createElement('div');e.className=cls||'sp';
  if(st){e.style.width=st.w*S+'px';e.style.height=st.h*S+'px';e.style.backgroundImage='url('+st.src+')';e.style.backgroundSize=(st.w*st.n*S)+'px '+(st.h*S)+'px';}
  layer.appendChild(e);return e;}
function draw(o){const st=o.st;let x=t0+(o.x-st.w/2)*S;x=((x%tw)+tw)%tw;if(x>cw)x-=tw;
  o.el.style.transform='translate('+x+'px,'+((o.y-st.h)*S)+'px)'+(o.flip?' scaleX(-1)':'');
  o.el.style.backgroundPosition=(-Math.floor(o.f)%st.n*st.w*S)+'px 0';o.el.style.zIndex=Math.round(o.y);}
function build(){const d=document.getElementById('dorf');if(!d)return;layer=d.querySelector('.anim');layer.innerHTML='';ents=[];
  S=+getComputedStyle(document.documentElement).getPropertyValue('--ds')||.5;cw=d.clientWidth;tw=D.W*S;t0=cw/2-tw/2;
  // Muehlenfluegel
  for(const [sx,sy] of D.sail){const st={src:D.sailimg,w:64,h:80,n:4};const o={st,x:sx+32,y:sy+80,f:0,k:'sail',el:mk(st)};o.el.style.zIndex=1000;ents.push(o);}
  // Leute auf der Strasse
  const ws=D.walkers.slice().sort(()=>Math.random()-.5).slice(0,9);
  ws.forEach((st,i)=>{const o={st,k:'walk',x:(i+Math.random())*D.W/ws.length,dir:Math.random()<.5?-1:1,v:rnd(9,15),f:0,pause:0,el:mk(st)};o.y=roadY(o.x);ents.push(o);});

  const WT=D.water;

  for(let i=0;i<5;i++){const o={k:'fly',st:D.butterfly,x:rnd(0,D.W),y:rnd(40,240),bx:0,by:0,ph:rnd(0,6),v:rnd(8,14)*(Math.random()<.5?-1:1),f:0,el:mk(D.butterfly)};o.by=o.y;o.el.style.zIndex=900;ents.push(o);}

  for(let i=0;i<4;i++){const src=D.clouds[i%2],e=document.createElement('img');e.src=src;e.className='cl';layer.appendChild(e);

}
function tick(ts){const dt=Math.min(.1,(ts-(last||ts))/1000);last=ts;

   if(o.k==='sail'){o.f+=dt*3.3;}

   else if(o.k==='duck'){o.t-=dt;if(o.tx!==undefined){const dx=o.tx-o.x,dy=o.ty-o.y,dd=Math.hypot(dx,dy);if(dd<.6){o.tx=undefined;o.st=D.duck.idle;o.t=rnd(2,6);}else{o.x+=dx/dd*5*dt;o.y+=dy/dd*5*dt;o.flip=dx>0;}o.f+=dt*5;}

     if(o.el._st!==o.st){o.el._st=o.st;o.el.style.width=o.st.w*S+'px';o.el.style.height=o.st.h*S+'px';o.el.style.backgroundImage='url('+o.st.src+')';o.el.style.backgroundSize=(o.st.w*o.st.n*S)+'px '+(o.st.h*S)+'px';}}
   else if(o.k==='fly'){o.ph+=dt*2;o.x+=o.v*dt+Math.sin(o.ph*1.3)*8*dt;o.y=o.by+Math.sin(o.ph)*10;o.f+=dt*12;o.flip=o.v<0;o.x=((o.x%D.W)+D.W)%D.W;}
