<script>

const SPR=__SPR__;
/* ---------- Ton und Musik (26.11.2026): Kenney-Pakete und Musik von Juhani Junkala und neonarkade, alles CC0, siehe src/ton/QUELLEN.md.
   Zu Beginn an (Browser spielen erst nach der ersten Beruehrung). Der Schalter wechselt «Musik und Ton», «Nur Ton», «Ton aus» und bleibt gespeichert.
   Toene: kurze Puffer in der Datei, mehrere Varianten pro Ton (name_1, name_2 ...), leicht verstimmt, je Ton hoechstens alle 50 ms, hoechstens 8 gleichzeitig.
   Musik: liegt neben index.html in musik/ und wird erst geladen, wenn sie gebraucht wird; fehlt sie (Datei offline geoeffnet), bleibt es still.
   Jedes Stueck laeuft als genaue Schleife, Wechsel blenden ueber; bei Abstimmung und grossen Momenten wird sie leiser. Im Hintergrund ist alles pausiert. */
const TON=__TON__,MUSIK=__MUSIK__;
let TONCTX=null,TONAKTIV=0,TONZEIT=0,TONMIX=null,MUSMIX=null,MUSJETZT=null,MUSQ=null,MUSG=null,MUSWUNSCH=null,MUSTIEF=0;
const TONBUF={},TONLAST={},TONVAR={},MUSPUF={},MUSLAED={},MUSVOL=0.42;
for(const k in TON){const b=k.replace(/_\d+$/,"");(TONVAR[b]=TONVAR[b]||[]).push(k);}
const TONWACKEL={klick:1,waehlen:1,zurueck:1,herz:1,herzweg:1,kanton:1,schritt:1,bauen:1,geld:1,seite:1,figur:1};
const TONGROSS={ja:1.6,nein_abst:1.2,schluss:2.2,krise:1,chance:0.9,glocke:1.4};
function tonAn(){return lsGet("13t_ton")!=="0";}
function musikAn(){return tonAn()&&lsGet("13t_musik")!=="0";}
function tonStart(){if(TONCTX||typeof window==="undefined")return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
 try{TONCTX=new C();}catch(e){return;}
 TONMIX=TONCTX.createGain();TONMIX.connect(TONCTX.destination);MUSMIX=TONCTX.createGain();MUSMIX.gain.value=MUSVOL;MUSMIX.connect(TONCTX.destination);
 for(const k in TON)fetch(TON[k]).then(r=>r.arrayBuffer()).then(b=>TONCTX.decodeAudioData(b,d=>{TONBUF[k]=d},()=>{})).catch(()=>{});}
function ton(k,delay=0,rate=0){if(!tonAn()||typeof performance==="undefined")return;tonStart();if(!TONCTX)return;TONZEIT=performance.now();
 const go=()=>{const now=performance.now();if(TONLAST[k]&&now-TONLAST[k]<50)return;const vs=TONVAR[k]||[k],key=vs[Math.floor(Math.random()*vs.length)],b=TONBUF[key];
  if(!b||!tonAn()||TONAKTIV>=8)return;TONLAST[k]=now;if(TONCTX.state==="suspended")TONCTX.resume();
  const q=TONCTX.createBufferSource();q.buffer=b;q.playbackRate.value=rate||(TONWACKEL[k]?0.95+Math.random()*0.1:1);q.connect(TONMIX);TONAKTIV++;q.onended=()=>{TONAKTIV--};q.start();
  if(TONGROSS[k])musikTief(TONGROSS[k]);};
 delay?setTimeout(go,delay):go();}
// Musik
function musikFuer(){const s=S&&S.screen;if(s==="round"||s==="event")return "runde"+(S.r%3+1);if(s==="summary"||s==="dorf")return "abend";if(s==="end")return "schluss";return "dorf";}
function musikPegel(s=0.6){if(!MUSMIX)return;const t=TONCTX.currentTime,f=performance.now()<MUSTIEF?0.3:(typeof document!=="undefined"&&document.querySelector&&document.querySelector(".vov")?0.45:1);
 MUSMIX.gain.cancelScheduledValues(t);MUSMIX.gain.setValueAtTime(MUSMIX.gain.value,t);MUSMIX.gain.linearRampToValueAtTime(musikAn()?MUSVOL*f:0,t+s);}
function musikTief(sek){MUSTIEF=Math.max(MUSTIEF,performance.now()+sek*1000);musikPegel(0.12);setTimeout(()=>musikPegel(0.8),sek*1000+20);}
function musik(k){MUSWUNSCH=k;if(!TONCTX)return;if(!musikAn()){musikStopp();return;}if(MUSJETZT===k)return;
 if(MUSPUF[k])return musikSpielen(k);if(MUSLAED[k]||!MUSIK[k])return;MUSLAED[k]=1;
 fetch("musik/"+k+".mp3").then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>TONCTX.decodeAudioData(b,d=>{MUSPUF[k]=d;if(MUSWUNSCH===k)musikSpielen(k);},()=>{})).catch(()=>{});}
function musikSpielen(k){if(!musikAn()||MUSJETZT===k)return;musikStopp();const b=MUSPUF[k],i=MUSIK[k],ch=b.getChannelData(0);
 // Schleife genau setzen: erstes hoerbares Sample im Puffer gegen das im Original (MP3-Vorlauf je nach Browser)

 const q=TONCTX.createBufferSource(),g=TONCTX.createGain(),t=TONCTX.currentTime;q.buffer=b;q.loop=true;q.loopStart=st;q.loopEnd=en;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+1.5);q.connect(g);g.connect(MUSMIX);q.start(t,st);MUSQ=q;MUSG=g;MUSJETZT=k;musikPegel();}
function musikStopp(){if(MUSQ&&TONCTX){const q=MUSQ,g=MUSG,t=TONCTX.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+1.2);setTimeout(()=>{try{q.stop()}catch(e){}},1300);}MUSQ=MUSG=null;MUSJETZT=null;}
// Schalter: Musik und Ton -> Nur Ton -> Ton aus -> Musik und Ton
function tonStufe(){return !tonAn()?0:musikAn()?2:1;}
function tonSchalten(){const s=tonStufe();if(s===2){lsSet("13t_musik","0");musikStopp();}else if(s===1){lsSet("13t_ton","0");musikStopp();}else{lsSet("13t_ton","1");lsSet("13t_musik","1");tonStart();musik(musikFuer());setTimeout(()=>ton("klick"),120);}render();}
function tonBtn(){const s=tonStufe(),txt=["Ton aus","Nur Ton","Musik und Ton"][s],nx=["Musik und Ton einschalten","Ton ausschalten","Musik ausschalten"][s];
 return `<button class="tonbtn small" aria-pressed="${s>0}" title="${nx}" aria-label="${txt}. Klicken: ${nx}" onclick="tonSchalten()"><span aria-hidden="true">${s===2?"♫":"♪"}</span> ${txt}</button>`;}
if(typeof addEventListener!=="undefined"){
 // Browser lassen Ton erst nach einer Beruehrung oder Taste zu
 const weck=()=>{if(!tonAn())return;tonStart();if(TONCTX&&TONCTX.state==="suspended")TONCTX.resume();musik(musikFuer());};
 addEventListener("pointerdown",weck,true);addEventListener("keydown",weck,true);
 // Knoepfe ohne eigenen Ton bekommen den Klick, «Mehr dazu» eine Buchseite (eigene Toene laufen im onclick davor und setzen TONZEIT)
 addEventListener("click",e=>{const t=e.target&&e.target.closest&&e.target;if(!t)return;const sm=t.closest("summary");if(sm){ton("seite");return;}
  const b=t.closest("button,.pick,.fig");if(!b||b.classList.contains("tonbtn")||b.disabled)return;if(performance.now()-TONZEIT>40)ton("klick");});
 if(typeof document!=="undefined")document.addEventListener("visibilitychange",()=>{if(!TONCTX)return;if(document.hidden)TONCTX.suspend();else if(tonAn())TONCTX.resume();});}
/* Fehler fangen: statt eines stehenden Bildschirms eine Karte mit «Neu laden». Der Spielstand ist gespeichert (saveGame). */
function showCrash(msg,stack){if(typeof document==="undefined"||!document.body||document.getElementById("crash"))return;
 const e=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";"),info=[msg,(stack||"").split("\n").slice(0,4).join("\n"),
  "Bildschirm: "+(typeof S!=="undefined"&&S?S.screen+", Runde "+(S.r+1)+", Spielnummer "+S.seed:"–"),"Adresse: "+location.href].join("\n");
 const d=document.createElement("div");d.id="crash";d.className="ovl";d.setAttribute("role","alertdialog");d.setAttribute("aria-modal","true");
 d.innerHTML=`<div class="crisis big"><div class="lbl">Fehler</div><h3>Da ist etwas schiefgelaufen</h3><p class="tx">Dein Spielstand ist gespeichert. Lade die Seite neu, dann geht es dort weiter, wo du warst.</p><div class="row" style="margin-top:12px"><button class="primary" onclick="location.reload()">Neu laden</button><button onclick="document.getElementById('crash').remove()">Trotzdem weiterspielen</button></div><details><summary>Angaben für die Lehrperson</summary><pre style="white-space:pre-wrap;font-size:12px">${e(info)}</pre></details></div>`;
 document.body.appendChild(d);const b=d.querySelector("button");if(b&&b.focus)b.focus();}
if(typeof addEventListener!=="undefined"){
 addEventListener("error",ev=>{if(/^(chrome|moz|safari)-extension:/.test(ev.filename||"")||/ResizeObserver/.test(ev.message||""))return;showCrash(ev.message,ev.error&&ev.error.stack);});
 // Nur Programmfehler; Netzfehler im Gruppenspiel (Firebase) zeigen keine Karte

function figAnim(f,sc=4,kind="idle"){const a=SPR.anim&&SPR.anim[f];if(!a)return figImg(f,sc);const h=kind==="walk"?24:22;

/* ---------- Bewegung: Sprechblasen, Hüpfer, Gang durch die Zeit ---------- */
let FX=[];
function fx(...k){FX.push(...k);}
const RM=()=>typeof window!=="undefined"&&window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function bubble(html,ms=1300,delay=0){if(RM()||!document.body||!document.querySelector)return;setTimeout(()=>{const f=document.querySelector(".who .fa,.who img.px");if(!f||!f.getBoundingClientRect)return;const b=document.createElement("div"),eng=innerWidth<=700;b.className="bub"+(eng?" below":"");b.innerHTML=html;document.body.appendChild(b);
 const pos=()=>{const g=document.querySelector(".who .fa,.who img.px")||f,q=UQ(),r=g.getBoundingClientRect();if(eng){b.style.left=(r.left/q)+"px";b.style.top=(r.bottom/q+8)+"px";}else{b.style.left=(r.right/q+6)+"px";b.style.top=(r.top/q+2)+"px";}};
 pos();const t0=performance.now(),loop=()=>{if(!b.isConnected)return;pos();if(performance.now()-t0<ms)requestAnimationFrame(loop);};requestAnimationFrame(loop);setTimeout(()=>b.remove(),ms);},delay);}

const FXS={check:[18,14],spark:[14,14],bang:[4,14],dots:[16,4]};const FXI=k=>`<img class="px fxi" src="${SPR.fx[k]}" width="${FXS[k][0]}" height="${FXS[k][1]}" alt="">`;
function sparks(delay=0){if(RM()||!document.querySelector)return;setTimeout(()=>{const f=document.querySelector(".who .fa");if(!f||!f.getBoundingClientRect)return;const r=f.getBoundingClientRect();
 for(let i=0;i<5;i++){const s=document.createElement("div");s.className="spark";s.innerHTML=FXI("spark");s.style.left=((r.left+r.width/2)/UQ())+"px";s.style.top=((r.top+r.height*0.3)/UQ())+"px";
  const a=-Math.PI/2+(i-2)*0.55;s.style.setProperty("--dx",Math.round(Math.cos(a)*48)+"px");s.style.setProperty("--dy",Math.round(Math.sin(a)*48)+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),700);}},delay);}
function applyFx(){const k=FX;FX=[];if(typeof document==="undefined"||!document.querySelector)return;
 for(const e of k){
  if(e==="hop"){figClass("hop",400);bubble(FXI("check"),900);}
  else if(e==="hopbig"){figClass("jump",800);sparks(150);bubble(FXI("check")+FXI("check"),1200);}
  else if(e==="hopsmall"){bubble(FXI("check"),700);}
  else if(e==="heart"){bubble(IC("herz",16),800);}
  else if(e==="yay"){figClass("hop",400,1300);sparks(1350);bubble(FXI("bang")+FXI("bang"),1400,1300);}
  else if(e==="sad"){figClass("sad",1200,1300);bubble(FXI("dots"),1500,1300);}
  else if(e==="bang"){ton(EVKIND[S.event||S.nextEvent]==="Gelegenheit"?"chance":"krise",350);figClass("shake",500,350);bubble(FXI("bang"),1400,350);}
  else if(e==="wishgone"){bubble(`<span class="wb">${IC("herz",12,true)}</span>`+FXI("dots"),1500);}
  else if(e==="walk")walkOverlay();
  else if(e==="end"){if(RM())ton("schluss");endAnim();const ok=val(2050,ACT)<6&&sum(2026,2050,ACT)<200,mid=val(2050,ACT)<val(2050,NO);const d=RM()?0:2500;
   if(ok){figClass("hop",400,d);sparks(d+50);bubble(FXI("bang")+FXI("bang"),1400,d);}else if(mid){figClass("hop",400,d);bubble(FXI("check"),1200,d);}else{figClass("sad",1200,d);bubble(FXI("dots"),1500,d);}}}}
/* Schluss: Fussabdruck zaehlt von 12.8 t herunter, Punkte zaehlen hoch, der Weg zu 0.6 t fuellt sich, dann werden die Etappen einzeln abgehakt (Review 26.11.2026).
   Ohne Animation (Bewegung reduzieren) steht sofort alles da. */
function endAnim(){if(RM()||!document.querySelector||S.screen!=="end")return;
 const nums=[...document.querySelectorAll(".endnums .v")],sx=[...document.querySelectorAll(".stufenx .sx.ok")],bars=[...document.querySelectorAll(".paris .cbar i")];
 const ziel=nums.map(n=>n.textContent),T=1400,t0=performance.now();
 const alle=[...document.querySelectorAll(".stufenx .sx")],nOf=x=>x.querySelector(".n"),alt=sx.map(x=>nOf(x)&&nOf(x).textContent);
 sx.forEach(x=>{x.classList.remove("ok");const n=nOf(x);if(n)n.textContent=String(alle.indexOf(x)+1);});
 const bw=bars.map(b=>b.style.width);bars.forEach(b=>{b.style.transition="none";b.style.width="0%";});
 requestAnimationFrame(()=>requestAnimationFrame(()=>bars.forEach((b,i)=>{b.style.transition=`width ${T}ms steps(12)`;b.style.width=bw[i];})));
 const zahl=(el,txt,k)=>{const m=txt.match(/^([−-]?[\d.]+)(.*)$/);if(!m)return;const neg=m[1][0]==="−",to=parseFloat(m[1].replace("−","-")),dez=(m[1].split(".")[1]||"").length,from=k===0?START:0;
  const zeig=x=>(neg&&x<0?"−"+Math.abs(x).toFixed(dez):x.toFixed(dez))+m[2];el.textContent=zeig(from);
  const f=n=>{const q=Math.min(1,(n-t0)/T),e=1-Math.pow(1-q,3);el.textContent=zeig(from+(to-from)*e);if(q<1&&el.isConnected)requestAnimationFrame(f);else el.textContent=txt;};requestAnimationFrame(f);};
 nums.forEach((el,k)=>zahl(el,ziel[k],k));
 setTimeout(()=>ton("schluss"),T+400+sx.length*450);
 sx.forEach((x,i)=>setTimeout(()=>{if(!x.isConnected)return;ton("etappe",0,1+i*0.08);x.classList.add("ok","pop");const n=nOf(x);if(n)n.textContent=alt[i];},T+250+i*450));}
function walkOverlay(){if(RM()||!document.body||!document.createElement)return;
 const yrs=PER.map(p=>p.a).concat([2050]),to=S.screen==="end"?yrs.length-1:S.r,from=Math.max(0,to-1);
 const W=Math.min(640,(window.innerWidth||800)-60),x=i=>20+i*(W-60)/(yrs.length-1);

 <div class="walker" style="left:${x(from)-26}px">${figAnim(S.fig,3,"walk")}</div></div></div>`;
 document.body.appendChild(o);const w=o.querySelector(".walker");
 requestAnimationFrame(()=>requestAnimationFrame(()=>{w.style.left=(x(to)-26)+"px";}));
 setTimeout(()=>{const fa=w.querySelector(".fa");if(fa&&SPR.anim[S.fig]){fa.className="fa idle";fa.style.backgroundImage=`url(${SPR.anim[S.fig].idle})`;fa.style.height=(22*3)+"px";}},1500);
 setTimeout(()=>{o.classList.add("out");setTimeout(()=>o.remove(),300);},2300);}
function wanderFig(f,sc=4){if(!SPR.anim||!SPR.anim[f])return figImg(f,sc);const a=SPR.anim[f];

let WT=null,WLAST=0;
function wanderTick(ts){if(typeof requestAnimationFrame!=="undefined")requestAnimationFrame(wanderTick);if(!document.querySelectorAll)return;const rm=RM();
 const now=Date.now(),dt=Math.min(0.1,WLAST?(now-WLAST)/1000:0);WLAST=now;
 document.querySelectorAll(".stage").forEach(st=>{const ws=[...st.querySelectorAll(".wander")];const W=st.clientWidth;if(!W)return;
  ws.forEach((w,i)=>{const sc=+w.dataset.sc,fw=17*sc;
   let s=w._s;if(!s){const x=ws.length>1?(W/(ws.length+1))*(i+1)-fw/2:(W-fw)/2;s=w._s={x,tx:x,next:now+800+Math.random()*3000,walking:false};w.style.left=x+"px";w.dataset.init=1;}
   if(rm)return; // Bewegung reduziert: Figuren stehen still, sind aber sichtbar
   const setWalk=on=>{if(on===s.walking)return;s.walking=on;w.classList.toggle("walking",on);};
   if(s.x!==s.tx){const step=40*dt,d=s.tx-s.x;s.x=Math.abs(d)<=step?s.tx:s.x+Math.sign(d)*step;w.style.left=Math.round(s.x)+"px";setWalk(true);if(s.x===s.tx){setWalk(false);s.next=now+2000+Math.random()*3500;}return;}
   if(now<s.next)return;
   const r=Math.random();if(r<0.6){const pv=ws[i-1]&&ws[i-1]._s,nb=ws[i+1]&&ws[i+1]._s,gap=8;
    const lo=pv?Math.max(pv.x,pv.tx)+fw+gap:4,hi=nb?Math.min(nb.x,nb.tx)-fw-gap:W-fw-4;
    if(hi-lo<20){s.next=now+1000;return;}
    const nx=lo+Math.random()*(hi-lo);if(Math.abs(nx-s.x)<20){s.next=now+800;return;}
    w.classList.toggle("left",nx<s.x);s.tx=nx;}
   else if(r<0.75){w.classList.toggle("left");s.next=now+1500+Math.random()*2500;}
   else s.next=now+2000+Math.random()*3000;});});}
function figImg(f,sc=4){return `<img class="px" src="${SPR.fig[f]}" width="${17*sc}" height="${22*sc}" alt="${f}">`}

const MODES={kurz:[[2026,2029],[2030,2034],[2035,2039],[2040,2044],[2045,2050]],lang:[[2026,2028],[2029,2031],[2032,2034],[2035,2037],[2038,2040],[2041,2043],[2044,2046],[2047,2050]]};
let PER=[],LAST=3;
function setMode(m){PER=MODES[m].map(([a,b])=>({a,b,l:a+" bis "+b}));LAST=PER.length-1;}
setMode("kurz");
// Wandel um dich herum: Fabriken, Landwirtschaft, Strom und Staat werden sauberer, auch dank Klimapolitik anderer Laender.
// Rund 1 % pro Jahr (BAFU/EBP 2025: Ausland-Anteil 2000-2023 -15 %, Inland -37 %). Was du selbst entscheidest

function subs(y,opt){
 // opt: {own:true/false, vorl:true/false, without:id, extra:{own:id}|{vorl:id,from}}
 const v={};
 for(const k in M.BASE)v[k]=M.BASE[k];

 }

  if(opt.extraVorl)vmul(v,opt.extraVorl,vorlFrom(S.r),y,opt);

 parts.forEach(([lab,v],i)=>{const x=Math.round(gap+i*(bw+gap)),a=run,b=run+v;run=b;

  g+=`<text x="${x+bw/2}" y="14" text-anchor="middle" class="cn">${lab}</text>`;});
 const x=Math.round(gap+parts.length*(bw+gap));

  ${host?`<details class="rules" style="margin-top:22px"${ROOM.test?" open":""}><summary>Testmodus</summary><p class="hint">Zum Ausprobieren allein oder zu zweit. Testfiguren setzen sich auf die Bank, entscheiden zufällig und sind jede Runde nach ein paar Sekunden fertig. Sie spielen nur, solange dieses Gerät offen ist.</p><div class="row"><button onclick="Bots.add(1)">1 Testfigur dazu</button><button onclick="Bots.add(3)">3 Testfiguren dazu</button></div></details>`:""}</div>`;
 }
};

function pickBallot(adopted,prev,R=Math.random){
 let pool=Object.keys(M.VORL).filter(k=>adopted[k]===undefined&&!prev.includes(k));
 if(pool.length<2)pool=Object.keys(M.VORL).filter(k=>adopted[k]===undefined);
 const b=[];while(b.length<2&&pool.length)b.push(pool.splice(Math.floor(R()*pool.length),1)[0]);
 return b;
}
function adoptedFrom(room){
 const a={};const st=room.stage||{};
 for(const r in st)for(const x of (st[r].res||[]))if(x.ok)a[x.k]=vorlFrom(+r);
 return a;
}

function makeG(code){
 return {code,
  n(){return (ROOM&&ROOM.n)||1},
  players(){const p=(ROOM&&ROOM.players)||{};return Object.keys(p).map(u=>({uid:u,...p[u]})).sort((a,b)=>a.order-b.order)},
  path(){return "rooms/"+code+"/players/"+NET.uid},
  totals(k){let h=0,d=0;const r=S.r;
   for(const p of this.players()){
    if(p.uid===NET.uid){h+=S.alloc[k]||0;d+=S.don[k]?1:0;continue;}
    const a=p.alloc&&p.alloc[r];const dn=p.don&&p.don[r];
    h+=(a&&a[k])||0;d+=(dn&&dn[k])||0;}
   return {h,d};},
  push(){NET.update(this.path(),{["alloc/"+S.r]:S.alloc,["don/"+S.r]:S.don,["palloc/"+S.r]:S.palloc||0});},
  ballotFor(r){const b=r==0?ROOM.ballot0:(ROOM.stage&&ROOM.stage[r-1]&&ROOM.stage[r-1].next);
   setBallot(b);this.push();},
  ready(){S.waiting=true;NET.update(this.path(),{["alloc/"+S.r]:S.alloc,["don/"+S.r]:S.don,["palloc/"+S.r]:S.palloc||0,["ready/"+S.r]:true});render();tryResolve();},
  unready(){if(ROOM.stage&&ROOM.stage[S.r])return;S.waiting=false;NET.update(this.path(),{["ready/"+S.r]:false});render();},
  active(){return this.players().filter(p=>p.online!==false&&p.fig)},
  missing(){return this.active().filter(p=>p.uid!==NET.uid&&!(p.ready&&p.ready[S.r])).map(p=>p.fig)},
  finish(){if(S.finished)return;S.finished=true;
   const Y=2050;NET.update(this.path(),{end:{v:+val(Y,ACT).toFixed(2),sum:Math.round(sum(2026,Y,ACT)),
    own:+(val(Y,ACT)-val(Y,VO)).toFixed(2),cards:Object.keys(S.chosen).length,...myParts()}});},
  endTable(){const ps=this.players();const vo=val(2050,VO);
   const ga=groupAvg("end");const gb=groupAvg("endsum");const okA=ga!=null&&ga<zielT();
   return `<h2>Eure Gruppe</h2><div class="callout"><span class="ic">${okA?"✓":"!"}</span><span>Ihr liegt 2050 im Schnitt bei <b>${ga==null?"–":fmt(ga)+" t"}</b>${gb!=null?`, Budget 2026 bis 2050 im Schnitt ${fmt(gb,0)} t`:""}. ${ga==null?"Noch nicht alle fertig.":`Das sind ${wegP(ga)} % des Wegs zu 0.6 t. ${okA?`Die erste Etappe unter ${fmt(zielT())} t habt ihr geschafft.`:`Bis zur ersten Etappe unter ${fmt(zielT())} t fehlen euch im Schnitt ${fmt(ga-zielT())} t.`}`}</span></div><p class="hint">Alle in der Gruppe profitieren gleich von den angenommenen Vorlagen. Ohne eigene Karten stünde jede Figur 2050 bei ${fmt(vo)} t.</p>
   <table><tr><th>Figur</th><th class="n">2050 pro Jahr</th><th class="n">davon eigene Entscheide</th><th class="n">Budget bis 2050</th><th class="n">Karten</th></tr>
   ${ps.map(p=>`<tr><td><span class="row" style="gap:8px">${figImg(p.fig,1)}${p.fig}</span>${p.uid===NET.uid?" · du":""}</td>${p.end?`<td class="n">${fmt(p.end.v)}</td><td class="n">${sgn(p.end.own)}</td><td class="n">${p.end.sum}</td><td class="n">${p.end.cards}</td>`:`<td colspan="4" class="hint">spielt noch</td>`}</tr>`).join("")}</table>`;},
  leave(){if(UNWATCH)UNWATCH();UNWATCH=null;NET.update(this.path(),{online:false});try{localStorage.removeItem("13t_g_"+code);localStorage.removeItem("13t_lastroom")}catch(e){}G=null;ROOM=null;}
 };
}

/* Testmodus: Testfiguren, die vom Geraet der Spielleitung gesteuert werden. Sie waehlen zufaellig und sind nach 3 bis 8 Sekunden fertig. */
const Bots={pend:{},
 async add(n){if(!G||!ROOM||ROOM.host!==NET.uid)return;const figs=Object.keys(M.FIG);await NET.update("rooms/"+G.code,{test:true});
  const used=G.players().map(p=>p.fig).filter(Boolean);
  for(let i=0;i<n;i++){let order=0;await NET.txn("rooms/"+G.code+"/seq",cur=>{order=cur||0;return order+1;});
   const free=figs.filter(f=>!used.includes(f));if(!free.length)break;const fig=free[0];used.push(fig);
   const bid="test"+Date.now().toString(36)+i;await NET.set("rooms/"+G.code+"/players/"+bid,{color:COLORS[order]||("Nr. "+(order+1)),order,online:true,fig,bot:true});await NET.set("rooms/"+G.code+"/taken/"+fig,bid);}},
 tick(){if(!G||!ROOM||ROOM.host!==NET.uid||S.screen==="lobby"||!ROOM.players)return;const r=S.r;
  const ballot=r==0?ROOM.ballot0:(ROOM.stage&&ROOM.stage[r-1]&&ROOM.stage[r-1].next);
  for(const p of G.players()){if(!p.bot)continue;const path="rooms/"+G.code+"/players/"+p.uid;
   if(ballot&&!(p.ready&&p.ready[r])&&!(ROOM.stage&&ROOM.stage[r])&&!Bots.pend[p.uid+":"+r]){Bots.pend[p.uid+":"+r]=1;
    setTimeout(()=>{if(!G||!ROOM)return;const al={},dn={};ballot.forEach(k=>{al[k]=Math.floor(Math.random()*3);dn[k]=Math.random()<.25?1:0;});
     const now=+(START-r*(START-5)/PER.length-Math.random()).toFixed(2);
     NET.update(path,{["alloc/"+r]:al,["don/"+r]:dn,["palloc/"+r]:Math.random()<.6?1:0,["ready/"+r]:true,now,sumnow:r?Math.round((START+now)/2*(PER[r].a-2026)):0});},3000+Math.random()*5000);}
   if(S.finished&&!p.end&&!Bots.pend[p.uid+":end"]){Bots.pend[p.uid+":end"]=1;const v=+(4.5+Math.random()*3.5).toFixed(2);
    const sm=Math.round(170+Math.random()*60);NET.update(path,{end:{v,sum:sm,own:-+(1+Math.random()*3).toFixed(2),cards:4+Math.floor(Math.random()*6),b:+(sum(2026,2050,NO)-sm).toFixed(1),e:+(val(2050,NO)-v).toFixed(2)}});}}}};

async function tryResolve(){
 if(!G||!ROOM)return;const r=S.r;
 if(ROOM.stage&&ROOM.stage[r])return;
 const act=G.active();
 if(!act.every(p=>p.uid===NET.uid?S.waiting:(p.ready&&p.ready[r])))return;
 const ballot=r==0?ROOM.ballot0:ROOM.stage[r-1].next;
 const adoptedBefore=adoptedFrom(ROOM);
 await NET.txn("rooms/"+G.code+"/stage/"+r,cur=>{
  if(cur)return;  // schon entschieden
  const res=ballot.map(k=>{const c=chance(k),roll=Math.floor(Math.random()*100);return {k,c,ok:roll<c,roll}});
  const ad={...adoptedBefore};res.forEach(x=>{if(x.ok)ad[x.k]=1});
  const contrib={};for(const p of act){const a=p.uid===NET.uid?S.alloc:((p.alloc||{})[r]||{});const dn=p.uid===NET.uid?S.don:((p.don||{})[r]||{});
   const pa=p.uid===NET.uid?(S.palloc||0):((p.palloc||{})[r]||0);
   contrib[p.uid]={fig:p.fig,color:p.color,h:Object.values(a).reduce((x,y)=>x+(y||0),0),d:Object.values(dn).reduce((x,y)=>x+(y||0),0),p:pa};}
  return {res,contrib,next:r<LAST?pickBallot(ad,ballot):[]};
 });
}

function onRoom(){
 if(!ROOM||!G){return;}
 try{Bots.tick()}catch(e){}
 if(S.screen==="lobby"){
  if(ROOM.status==="play"){
   const me=ROOM.players[NET.uid];
   S.mode=ROOM.mode;setMode(ROOM.mode);
   // Wiederbeitritt nach Neuladen: eigenen Spielstand aus diesem Browser holen (UX-Test 21.11.)
   const sv=loadSave("13t_g_"+G.code);if(sv&&sv.fig===me.fig&&sv.r!=null){S=sv;setMode(S.mode);S.lastScr=null;if(!["round","summary","dorf","end","event"].includes(S.screen))S.screen="round";render();onRoom();return;}
   S.fig=me.fig;S.r=0;S.money=M.START[S.fig];beginRound();return;
  }
  render();return;
 }
 S.adopted=adoptedFrom(ROOM);updPdone();
 const st=ROOM.stage&&ROOM.stage[S.r];
 if(S.screen==="round"){
  if(st&&!S.results){
   S.results=st.res;S.waiting=false;setTimeout(()=>{if(S.screen==="round")voteShow(()=>{fx((S.results||[]).some(x=>x.ok)?"yay":"sad");voteScroll();});},50);
   logRound();
   render();return;
  }
  if(S.waiting)tryResolve();
  const y=window.scrollY;render();window.scrollTo(0,y);
 }
 if(S.screen==="end")render();
}

render();
if(typeof location!=="undefined"&&location.hash==="#lehrperson")openTeacher();
</script>
